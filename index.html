table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
.smallbtn{font-size:12px;padding:7px 9px!important}.pill{display:inline-block;padding:3px 7px;border-radius:20px;background:#edf2ee;font-size:11px}

.search{margin-bottom:10px}.empty{text-align:center;padding:25px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:600px;max-height:88vh;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch}

function cropChartData(){let groups={};function group(c){c=c||"पीक नमूद नाही";groups[c]=groups[c]||{crop:c,income:0,expense:0,expenseTypes:{}};return groups[c]}(state.plots||[]).forEach(p=>{let h=state.cropHarvest?.[p.id]||{},c=h.crop||p.crop||"द्राक्ष",g=group(c);g.income+=Number(h.tonnes||0)*Number(h.rate||0)});(state.cropIncome||[]).forEach(e=>{group(e.crop||"पीक नमूद नाही").income+=Number(e.qty||0)*Number(e.rate||0)});(state.cropExpenses||[]).forEach(e=>{let p=state.plots.find(x=>x.id===e.plotId),g=group(p?.crop||"पीक नमूद नाही"),a=Number(e.amount||0),type=e.type||"इतर";g.expense+=a;g.expenseTypes[type]=(g.expenseTypes[type]||0)+a});return Object.values(groups).sort((a,b)=>(b.income+b.expense)-(a.income+a.expense))}
function pieMarkup(title,items){let vals=items.filter(x=>x.value>0),total=vals.reduce((a,x)=>a+x.value,0);if(!total)return `<div class="panel"><b>${esc(title)}</b><div class="empty">अजून नोंदी उपलब्ध नाहीत.</div></div>`;let colors=["#277da1","#43aa8b","#f9c74f","#f9844a","#9b5de5","#577590","#f15bb5","#90be6d","#f3722c","#6c757d"],angle=0,stops=vals.map((x,i)=>{let start=angle;angle+=x.value/total*360;return `${colors[i%colors.length]} ${start}deg ${angle}deg`}).join(",");return `<div class="panel"><b>${esc(title)}</b><div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:12px"><div aria-label="${esc(title)}" role="img" style="width:170px;height:170px;max-width:48vw;border-radius:50%;background:conic-gradient(${stops});flex:none"></div><div style="flex:1;min-width:150px">${vals.map((x,i)=>`<div style="display:flex;align-items:center;gap:7px;margin:6px 0;font-size:13px"><span style="width:11px;height:11px;border-radius:3px;background:${colors[i%colors.length]};flex:none"></span><span style="flex:1">${esc(x.label)}</span><b>₹${fmt(x.value)} (${(x.value/total*100).toFixed(1)}%)</b></div>`).join("")}<div style="border-top:1px solid var(--line);padding-top:7px;margin-top:8px"><b>एकूण: ₹${fmt(total)}</b></div></div></div></div>`}
function cropChartsDashboard(){let rows=cropChartData(),max=Math.max(1,...rows.flatMap(x=>[x.income,x.expense])),colors={income:"#198754",expense:"#e58b32"};let bars=rows.length?`<div class="panel"><b>प्रत्येक पिकाचे उत्पन्न विरुद्ध खर्च</b><div class="muted" style="margin:5px 0 12px">हिरवा = उत्पन्न • नारंगी = खर्च (₹)</div>${rows.map(x=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${esc(x.crop)}</b><div style="display:flex;align-items:center;gap:7px;margin-top:5px"><span style="width:62px;font-size:12px">उत्पन्न</span><div style="background:#e8eee9;height:13px;border-radius:8px;flex:1;overflow:hidden"><div style="height:100%;width:${x.income/max*100}%;background:${colors.income};border-radius:8px"></div></div><b style="font-size:12px;min-width:75px;text-align:right">₹${fmt(x.income)}</b></div><div style="display:flex;align-items:center;gap:7px;margin-top:5px"><span style="width:62px;font-size:12px">खर्च</span><div style="background:#f1ece6;height:13px;border-radius:8px;flex:1;overflow:hidden"><div style="height:100%;width:${x.expense/max*100}%;background:${colors.expense};border-radius:8px"></div></div><b style="font-size:12px;min-width:75px;text-align:right">₹${fmt(x.expense)}</b></div></div>`).join("")}</div>`:`<div class="empty">पीकनिहाय नोंदी उपलब्ध नाहीत.</div>`;let incomes=rows.map(x=>({label:x.crop,value:x.income})),expenses=rows.map(x=>({label:x.crop,value:x.expense})),types={};rows.forEach(x=>Object.entries(x.expenseTypes).forEach(([k,v])=>types[k]=(types[k]||0)+v));return `${bars}<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${pieMarkup("पीकनिहाय उत्पन्न वाटा",incomes)}${pieMarkup("पीकनिहाय खर्च वाटा",expenses)}${pieMarkup("खर्चाच्या प्रकारानुसार वाटा",Object.entries(types).map(([label,value])=>({label,value})))}</div><div class="muted" style="margin:6px 0">टीप: या चार्टमध्ये नोंदवलेल्या विक्री उत्पन्न आणि पीकनिहाय खर्चाचा समावेश आहे. सर्वसाधारण खर्चाला प्लॉट / पीक जोडलेले नसल्यामुळे तो पीकनिहाय चार्टमध्ये धरलेला नाही.</div>`}
function plotFinanceTotals(){return state.plots.map(p=>{let h=state.cropHarvest?.[p.id]||{},legacy=Number(h.tonnes||0)*Number(h.rate||0),receipts=(state.cropIncome||[]).filter(e=>e.plotId===p.id),revenue=legacy+receipts.reduce((a,e)=>a+Number(e.qty||0)*Number(e.rate||0),0),tonnes=Number(h.tonnes||0)+receipts.reduce((a,e)=>a+Number(e.qty||0),0)/1000,expenses=(state.cropExpenses||[]).filter(e=>e.plotId===p.id).reduce((a,e)=>a+Number(e.amount||0),0);return {p,h,revenue,tonnes,expenses,net:revenue-expenses}})}
function cropFinanceSummary(rows){let groups={};rows.forEach(x=>{let c=x.h.crop||x.p.crop||"द्राक्ष";groups[c]=groups[c]||{tonnes:0,revenue:0,expenses:0};groups[c].tonnes+=Number(x.tonnes||0);groups[c].revenue+=x.revenue;groups[c].expenses+=x.expenses});return Object.entries(groups).map(([crop,x])=>{let net=x.revenue-x.expenses;return `<div class="task"><b>${esc(crop)}</b><div class="muted">एकूण उत्पादन: ${fmt(x.tonnes)} टन • एकूण विक्री उत्पन्न: ₹${fmt(x.revenue)}</div><div class="muted">एकूण नोंदवलेला खर्च: ₹${fmt(x.expenses)}</div><div style="font-size:19px;font-weight:800;color:${net>=0?'#176b43':'#b42318'}">निव्वळ ${net>=0?'नफा':'तोटा'}: ₹${fmt(net)}</div></div>`}).join("")}
function financeSummary(rows){return rows.map(x=>{let hasLegacy=Number(x.h?.tonnes||0)!==0||Number(x.h?.rate||0)!==0;return `<div class="task"><div class="tasktop"><b>${esc(x.p.name)} • ${esc(x.h.crop||x.p.crop||"द्राक्ष")}</b><span class="tag">${fmt(x.tonnes||0)} टन</span></div><div class="muted">नोंदवलेल्या सर्व विक्री पावत्यांचे उत्पन्न: ₹${fmt(x.revenue)}</div><div class="muted">नोंदवलेला खर्च: ₹${fmt(x.expenses)}</div><div style="font-size:18px;font-weight:800;color:${x.net>=0?'#176b43':'#b42318'}">निव्वळ ${x.net>=0?'नफा':'तोटा'}: ₹${fmt(x.net)}</div>${hasLegacy?`<button class="danger smallbtn" style="margin-top:8px" onclick="deleteLegacyHarvest('${esc(x.p.id)}')">या प्लॉटची जुनी काढणी उत्पन्न नोंद हटवा</button>`:""}</div>`}).join("")}
function saveHarvest(){let id=document.getElementById("harvestPlot").value,tonnes=Number(document.getElementById("harvestQty").value||0),rate=Number(document.getElementById("harvestRate").value||0);if(tonnes<0||rate<0){alert("योग्य उत्पादन व दर भरा");return}state.cropHarvest=state.cropHarvest||{};state.cropHarvest[id]={tonnes,rate,date:document.getElementById("harvestDate").value};save();render("finance")}
function legacyHarvestRegister(){let rows=Object.entries(state.cropHarvest||{}).filter(([id,h])=>Number(h?.tonnes||0)!==0||Number(h?.rate||0)!==0).map(([id,h])=>({id,h,p:state.plots.find(p=>p.id===id)})).sort((a,b)=>(b.h.date||"").localeCompare(a.h.date||""));if(!rows.length)return `<div class="empty">जुन्या काढणी उत्पन्न नोंदी नाहीत.</div>`;return rows.map(x=>`<div class="task"><div class="tasktop"><b>${esc(x.h.crop||x.p?.crop||"पीक नमूद नाही")} • ${esc(x.p?.name||"प्लॉट")}</b><span class="tag">${dateFmt(x.h.date)}</span></div><div class="muted">उत्पादन: ${fmt(x.h.tonnes)} टन • दर: ₹${fmt(x.h.rate)}/टन</div><b>उत्पन्न: ₹${fmt(Number(x.h.tonnes||0)*Number(x.h.rate||0))}</b><div class="row"><button class="secondary smallbtn" onclick="editLegacyHarvest('${esc(x.id)}')">संपादित करा</button><button class="secondary smallbtn" onclick="deleteLegacyHarvest('${esc(x.id)}')">हटवा</button></div></div>`).join("")}
function editLegacyHarvest(id){let h=state.cropHarvest?.[id],p=state.plots.find(x=>x.id===id);if(!h)return;openModal(`<h3>जुनी काढणी उत्पन्न नोंद संपादित करा</h3><label>पीक नाव</label><select id="legacyCrop">${state.crops.map(c=>`<option value="${esc(c)}" ${(h.crop||p?.crop)===c?"selected":""}>${esc(c)}</option>`).join("")}</select><label>उत्पादन (टन)</label><input id="legacyQty" type="number" min="0" step="0.01" value="${Number(h.tonnes||0)}"><label>विक्री दर (₹ प्रति टन)</label><input id="legacyRate" type="number" min="0" step="0.01" value="${Number(h.rate||0)}"><label>दिनांक</label><input id="legacyDate" type="date" value="${esc(h.date||TODAY)}"><div class="row"><button class="secondary" onclick="closeModal()">रद्द</button><button class="primary" onclick="saveLegacyHarvest('${esc(id)}')">बदल सेव्ह करा</button></div>`)}
function saveLegacyHarvest(id){let h=state.cropHarvest?.[id],tonnes=Number(document.getElementById("legacyQty").value||0),rate=Number(document.getElementById("legacyRate").value||0);if(!h||tonnes<0||rate<0){alert("योग्य उत्पादन आणि दर भरा");return}Object.assign(h,{crop:document.getElementById("legacyCrop").value,tonnes,rate,date:document.getElementById("legacyDate").value});save();closeModal();render("finance")}
function deleteLegacyHarvest(id){if(!state.cropHarvest?.[id])return;if(!confirm("ही जुनी काढणी उत्पन्न नोंद कायमची हटवायची का?"))return;delete state.cropHarvest[id];save();render("finance")}
function syncIncomeCrop(){let p=state.plots.find(x=>x.id===document.getElementById("incomePlot").value);if(p&&p.crop&&state.crops.includes(p.crop))document.getElementById("incomeCrop").value=p.crop}
function addCropIncome(){let plotId=document.getElementById("incomePlot").value,qty=Number(document.getElementById("incomeQty").value||0),rate=Number(document.getElementById("incomeRate").value||0),date=document.getElementById("incomeDate").value;if(!plotId||qty<=0||rate<0||!date){alert("प्लॉट, विक्री मात्रा, दर आणि दिनांक योग्य भरा");return}state.cropIncome=state.cropIncome||[];state.cropIncome.push({id:Date.now(),plotId,crop:document.getElementById("incomeCrop").value,vendor:document.getElementById("incomeVendor").value.trim(),qty,rate,date});save();render("finance")}
function cropIncomeRegister(){let rows=(state.cropIncome||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.id-a.id);if(!rows.length)return `<div class="empty">अजून विक्री पावत्या नोंदवलेल्या नाहीत.</div>`;let groups={};rows.forEach(e=>{let k=e.crop||"पीक निवडा";groups[k]=groups[k]||[];groups[k].push(e)});return Object.entries(groups).map(([crop,items])=>{let details=items.map(e=>{let p=state.plots.find(x=>x.id===e.plotId);return `<div style="border-top:1px solid var(--line);padding:9px 0"><div class="tasktop"><b>${dateFmt(e.date)} • ${esc(e.vendor||"विक्रेता नमूद नाही")}</b><button class="secondary smallbtn" onclick="editCropIncome(${e.id})">पीक / नोंद बदला</button></div><div class="muted">${esc(p?.name||"प्लॉट")} • मात्रा ${fmt(e.qty)} किलो • दर ₹${fmt(e.rate)}/किलो</div><b>रक्कम: ₹${fmt(e.qty*e.rate)}</b></div>`}).join("");return `<div class="task"><div class="tasktop"><b>${esc(crop)}</b><span class="tag">एकूण ₹${fmt(items.reduce((a,e)=>a+e.qty*e.rate,0))}</span></div>${details}</div>`}).join("")}
function editCropIncome(id){let e=(state.cropIncome||[]).find(x=>x.id===id);if(!e)return;openModal(`<h3>उत्पन्न पावती बदला</h3><label>पीक नाव — यादीतून निवडा</label><select id="editIncomeCrop">${state.crops.map(c=>`<option value="${esc(c)}" ${e.crop===c?"selected":""}>${esc(c)}</option>`).join("")}</select><label>प्लॉट</label><select id="editIncomePlot">${state.plots.map(p=>`<option value="${esc(p.id)}" ${e.plotId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select><label>विक्रेता</label><input id="editIncomeVendor" value="${esc(e.vendor||"")}"><label>विक्री मात्रा (किलो)</label><input id="editIncomeQty" type="number" min="0" step="0.01" value="${e.qty}"><label>विक्री दर (₹ प्रति किलो)</label><input id="editIncomeRate" type="number" min="0" step="0.01" value="${e.rate}"><label>दिनांक</label><input id="editIncomeDate" type="date" value="${esc(e.date||TODAY)}"><div class="row"><button class="secondary" onclick="closeModal()">रद्द</button><button class="primary" onclick="saveCropIncome(${id})">बदल सेव्ह करा</button></div>`)}
function saveCropIncome(id){let e=state.cropIncome.find(x=>x.id===id),qty=Number(document.getElementById("editIncomeQty").value||0),rate=Number(document.getElementById("editIncomeRate").value||0);if(!e||qty<=0||rate<0){alert("योग्य मात्रा आणि दर भरा");return}Object.assign(e,{crop:document.getElementById("editIncomeCrop").value,plotId:document.getElementById("editIncomePlot").value,vendor:document.getElementById("editIncomeVendor").value.trim(),qty,rate,date:document.getElementById("editIncomeDate").value});save();closeModal();render("finance")}
function addCropExpense(){let plotId=document.getElementById("cropExpensePlot").value,amount=Number(document.getElementById("cropExpenseAmount").value||0);if(!plotId||amount<=0){alert("प्लॉट आणि शून्यापेक्षा जास्त खर्च भरा");return}state.cropExpenses=state.cropExpenses||[];state.cropExpenses.push({id:Date.now(),plotId,type:document.getElementById("cropExpenseType").value,amount,note:document.getElementById("cropExpenseNote").value,date:document.getElementById("cropExpenseDate").value});save();render("finance")}
function cropExpenseList(){if(!state.cropExpenses?.length)return `<div class="empty">अजून पीकनिहाय खर्च नोंदवलेला नाही.</div>`;return state.cropExpenses.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(e=>{let p=state.plots.find(p=>p.id===e.plotId);return `<div class="task"><div class="tasktop"><b>${esc(e.type)} • ₹${fmt(e.amount)}</b><button class="danger smallbtn" onclick="deleteCropExpense(${e.id})">काढा</button></div><div class="muted">${esc(p?.name||"प्लॉट")} • ${dateFmt(e.date)} • ${esc(e.note||"")}</div></div>`}).join("")}
function deleteCropExpense(id){if(confirm("हा खर्च काढायचा?")){state.cropExpenses=state.cropExpenses.filter(e=>e.id!==id);save();render("finance")}}
function taskList(items){
 if(!items.length)return `<div class="empty">या तारखेला नियोजित काम नाही.</div>`;
 return items.map(x=>{let done=taskStatus(x.id);return `<div class="task ${done?'done':''}"><div class="tasktop"><b>${esc(x.activity||x.item)}</b><span class="tag ${done?'':'warn'}">${done?'पूर्ण':'बाकी'}</span></div><div class="muted">${esc(x.plot)} • ${esc(x.method)}</div><div style="margin:7px 0">${esc(x.item)} : <b>${fmt(x.qty)} ${esc(x.unit)}</b>${x.water?` • पाणी ${fmt(x.water)} L`:""}</div><div class="row"><button class="${done?'secondary':'primary'} smallbtn" onclick="completeTask(${x.id})">${done?'पूर्ण नोंद बदल':'काम पूर्ण करा'}</button><button class="secondary smallbtn" onclick="taskDetails(${x.id})">तपशील</button></div></div>`}).join("");
}
function showDate(d){document.getElementById("taskResults").innerHTML=taskList(tasksForDay(d))}
function filterTasks(){let q=document.getElementById("taskSearch").value.toLowerCase(),d=document.getElementById("dateFilter").value;let a=tasksForDay(d).filter(x=>(x.plot+x.activity+x.item+x.method).toLowerCase().includes(q));document.getElementById("taskResults").innerHTML=taskList(a)}
function completeTask(id){
 let x=SOURCE.schedule.find(x=>x.id===id);if(!x)return;
 if(taskStatus(id)){alert("हे काम आधीच पूर्ण नोंदवले आहे. दुरुस्तीसाठी तपशील उघडा.");return}
 openModal(`<h3>काम पूर्ण नोंदवा</h3><p>${esc(x.plot)} • ${esc(x.item)}</p><label>प्रत्यक्ष वापर (${esc(x.unit)})</label><input id="actualQty" type="number" min="0" step="any" value="${x.qty}"><label>नोंद / निरीक्षण</label><input id="taskNote" placeholder="ऐच्छिक"><div class="row"><button class="secondary" onclick="closeModal()">रद्द</button><button class="primary" onclick="saveTaskDone(${id})">पूर्ण सेव्ह करा</button></div><p class="muted">साठ्यातून प्रत्यक्ष वापर वजा होईल. नोंद फक्त एकदाच लागू होईल.</p>`);
}
function saveTaskDone(id){
 let x=SOURCE.schedule.find(x=>x.id===id),qty=Number(document.getElementById("actualQty").value);
 if(!Number.isFinite(qty)||qty<0){alert("योग्य प्रमाण टाका");return}
 let s=stockFor(x.item);if(s)s.used=Number(s.used||0)+qty;
 state.tasks[id]={done:true,actualQty:qty,note:document.getElementById("taskNote").value,completedAt:new Date().toISOString()};
 save();closeModal();render(currentTab());
}
function taskDetails(id){let x=SOURCE.schedule.find(x=>x.id===id),r=state.tasks[id];openModal(`<h3>कामाचा तपशील</h3><p><b>${esc(x.activity)}</b></p><p>${esc(x.date)} • ${esc(x.plot)}</p><p>${esc(x.item)} : ${fmt(x.qty)} ${esc(x.unit)}</p><p>पद्धत: ${esc(x.method)}</p><p>स्थिती: ${r?.done?'पूर्ण':'बाकी'}</p>${r?.done?`<p>प्रत्यक्ष वापर: ${fmt(r.actualQty)} ${esc(x.unit)}</p><p>नोंद: ${esc(r.note||'—')}</p><button class="danger" onclick="undoTask(${id})">पूर्ण नोंद रद्द करा</button>`:''}<button class="secondary" onclick="closeModal()">बंद</button>`)}
function undoTask(id){let x=SOURCE.schedule.find(x=>x.id===id),r=state.tasks[id];if(r?.done){let s=stockFor(x.item);if(s)s.used=Math.max(0,Number(s.used||0)-Number(r.actualQty||0));delete state.tasks[id];save();closeModal();render(currentTab())}}
function latestPurchaseFor(name){return (state.purchases||[]).filter(p=>p.name===name&&Number(p.qty)>0).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0]||null}
function stockTable(items){return `<div style="overflow:auto"><table><thead><tr><th>वस्तू</th><th>उपलब्ध साठा</th><th>शिफारस केलेला साठा</th><th>निव्वळ आवश्यक मात्रा</th><th>शेवटचा खरेदी दर (₹/युनिट)</th><th>शेरा</th><th></th></tr></thead><tbody>${items.map(s=>{let available=balance(s),recommended=Number(s.recommended??s.required??0),net=recommended-available,remark=net>0.000001?"अपुरा":net< -0.000001?"जादा":"पुरेसा",lp=latestPurchaseFor(s.name),unitCost=Number(s.lastUnitCost??(lp?Number(lp.cost||0)/Number(lp.qty||1):0));return `<tr><td><b>${esc(s.name)}</b><div class="muted">${esc(s.unit)}</div></td><td><b style="color:${available<recommended?'#b42318':'#176b43'}">${fmt(available)}</b></td><td>${fmt(recommended)}</td><td><b style="color:${net>0?'#b42318':net<0?'#176b43':'#667085'}">${fmt(Math.abs(net))} ${net<0?"(जादा)":""}</b></td><td>${lp||s.lastUnitCost?`₹${fmt(unitCost)}`:"—"}</td><td><span class="tag" style="color:${remark==="अपुरा"?"#b42318":remark==="जादा"?"#176b43":"#667085"}">${remark}</span></td><td><button class="secondary smallbtn" onclick="editStock(${state.stock.indexOf(s)})">बदल</button></td></tr>`}).join("")}</tbody></table></div>`}
function filterStock(){let q=document.getElementById("stockSearch").value.toLowerCase();document.getElementById("stockResults").innerHTML=stockTable(state.stock.filter(s=>s.name.toLowerCase().includes(q)))}
function editStock(i){let s=state.stock[i],lp=latestPurchaseFor(s.name),cost=Number(s.lastUnitCost??(lp?Number(lp.cost||0)/Number(lp.qty||1):0));openModal(`<h3>${esc(s.name)}</h3><label>उपलब्ध साठा — प्रत्यक्ष प्रमाण (${esc(s.unit)})</label><input id="availableQty" type="number" min="0" step="any" value="${balance(s)}"><label>प्रति युनिट किंमत (₹/${esc(s.unit)})</label><input id="manualUnitCost" type="number" min="0" step="0.01" value="${cost}"><label>शिफारस केलेला साठा (${esc(s.unit)})</label><input id="recommended" type="number" min="0" step="any" value="${Number(s.recommended??s.required??0)}"><p class="muted">उपलब्ध साठा आणि प्रति युनिट किंमत स्वतंत्रपणे बदलता येतात. खरेदी व प्रत्यक्ष वापराच्या नोंदी पुढेही लागू राहतील.</p><button class="primary" onclick="saveStock(${i})">सेव्ह</button> <button class="secondary" onclick="closeModal()">रद्द</button>`)}
function saveStock(i){let s=state.stock[i],available=Math.max(0,Number(document.getElementById("availableQty").value||0));s.opening=available-Number(s.received||0)+Number(s.used||0);s.lastUnitCost=Math.max(0,Number(document.getElementById("manualUnitCost").value||0));s.recommended=Math.max(0,Number(document.getElementById("recommended").value||0));s.minimum=s.minimum||0;save();closeModal();render("stock")}
function openPurchase(){openModal(`<h3>खरेदी नोंदवा</h3><label>वस्तू</label><select id="purchaseItem">${state.stock.map((s,i)=>`<option value="${i}">${esc(s.name)} (${esc(s.unit)})</option>`).join("")}</select><label>खर्चाचा प्रकार</label><select id="purchaseExpenseType"><option>खते</option><option>कीटकनाशके</option><option>बुरशीनाशके</option><option>इतर औषधे / संजीवके</option><option>इतर शेती साहित्य</option></select><label>खरेदी प्रमाण</label><input id="purchaseQty" type="number" min="0" step="any"><label>एकूण खरेदी किंमत (₹)</label><input id="purchaseCost" type="number" min="0" step="0.01" placeholder="एकूण बिल रक्कम"><div class="muted">प्रति युनिट खरेदी दर आपोआप मोजला जाईल आणि साठा तक्त्यात दिसेल.</div><label>दिनांक</label><input id="purchaseDate" type="date" value="${TODAY}"><button class="primary" onclick="savePurchase()">खरेदी सेव्ह करा</button> <button class="secondary" onclick="closeModal()">रद्द</button>`)}
function savePurchase(){let i=Number(document.getElementById("purchaseItem").value),q=Number(document.getElementById("purchaseQty").value),c=Number(document.getElementById("purchaseCost").value||0),date=document.getElementById("purchaseDate").value,type=document.getElementById("purchaseExpenseType").value;if(q<=0||c<0){alert("योग्य खरेदी प्रमाण आणि किंमत भरा");return}let s=state.stock[i],unitCost=c/q;s.received=Number(s.received||0)+q;s.lastUnitCost=unitCost;state.purchases=state.purchases||[];state.expenses=state.expenses||[];state.purchases.push({id:Date.now(),name:s.name,qty:q,unit:s.unit,cost:c,unitCost,expenseType:type,date});if(c>0)state.expenses.push({id:Date.now()+1,type,amount:c,note:"साठा खरेदी: "+s.name+" • "+fmt(q)+" "+s.unit+" • ₹"+fmt(unitCost)+"/"+s.unit,date,purchaseId:Date.now()});save();closeModal();render("stock")}
function workerType(w){return w.wageType||"daily"}
function plotCards(){return state.plots.map(p=>`<div class="task"><div class="tasktop"><b>${p.kind==="grape"?"🍇 द्राक्ष":"🌱 इतर पीक"} • ${esc(p.name)}</b><span class="tag">${esc(p.crop||"पीक निवडा")}</span></div><label>प्लॉटचे नाव</label><input id="plotname_${esc(p.id)}" value="${esc(p.name)}"><label>पीक नाव</label><select id="plotcrop_${esc(p.id)}">${state.crops.map(c=>`<option value="${esc(c)}" ${p.crop===c?"selected":""}>${esc(c)}</option>`).join("")}</select><button class="secondary" onclick="savePlot('${esc(p.id)}')">नाव / पीक सेव्ह करा</button></div>`).join("")}
function savePlot(id){let p=state.plots.find(x=>x.id===id);if(!p)return;let n=document.getElementById("plotname_"+id).value.trim(),c=document.getElementById("plotcrop_"+id).value;if(!n){alert("प्लॉटचे नाव लिहा");return}p.name=n;p.crop=c;save();render("plots")}
function addCrop(){let n=document.getElementById("newCropName").value.trim();if(!n)return;if(state.crops.some(c=>c.toLowerCase()===n.toLowerCase())){alert("हे पीक आधीच यादीत आहे");return}state.crops.push(n);save();render("crops")}
function saveStageLabour(){let plotId=document.getElementById("stagePlot").value,stage=document.getElementById("stageName").value,workers=Number(document.getElementById("stageWorkers").value),days=Number(document.getElementById("stageDays").value||1),note=document.getElementById("stageNote").value.trim();if(!plotId||!stage||workers<=0||days<=0){alert("प्लॉट, टप्पा, मजूर संख्या आणि दिवस योग्य भरा");return}let key=plotId+"|"+stage;state.stageLabour[key]={plotId,stage,workers,days,labourDays:workers*days,note,updatedAt:TODAY};save();render("crops")}
function saveOtherStageLabour(){let plotId=document.getElementById("otherStagePlot").value,stage=document.getElementById("otherStageName").value,workers=Number(document.getElementById("otherStageWorkers").value),days=Number(document.getElementById("otherStageDays").value||1),note=document.getElementById("otherStageNote").value.trim();if(!plotId||!stage||workers<=0||days<=0){alert("प्लॉट, टप्पा, मजूर संख्या आणि दिवस योग्य भरा");return}let key=plotId+"|"+stage;state.stageLabour[key]={plotId,stage,crop:state.plots.find(p=>p.id===plotId)?.crop||"इतर पीक",workers,days,labourDays:workers*days,note,updatedAt:TODAY,cropStage:true};save();render("crops")}
function stageLabourTable(){let rows=Object.values(state.stageLabour||{});if(!rows.length)return `<div class="empty">अजून मजूर गरज नोंदवलेली नाही. वरील फॉर्ममधून प्रत्येक प्लॉटसाठी टप्पा निवडा.</div>`;return rows.sort((a,b)=>a.plotId.localeCompare(b.plotId)||a.stage.localeCompare(b.stage)).map(r=>{let p=state.plots.find(x=>x.id===r.plotId);return `<div class="task"><div class="tasktop"><b>${esc(p?.name||r.plotId)}</b><span class="tag">${r.workers} मजूर</span></div><div><span class="tag">${r.cropStage?esc(p?.crop||r.crop||"इतर पीक"):"द्राक्ष"}</span> ${esc(r.stage)}</div><div class="muted">कामाचे दिवस: ${fmt(r.days)} • एकूण मजूर-दिवस: <b>${fmt(r.labourDays)}</b>${r.note?" • "+esc(r.note):""}</div><button class="secondary smallbtn" onclick="editStageLabour('${esc(r.plotId)}','${esc(r.stage)}')">बदला</button> <button class="danger smallbtn" onclick="deleteStageLabour('${esc(r.plotId)}','${esc(r.stage)}')">काढा</button></div>`}).join("")}
function editStageLabour(plotId,stage){let r=state.stageLabour[plotId+"|"+stage];if(!r)return;openModal(`<h3>मजूर गरज बदला</h3><p>${esc(stage)}</p><label>मजूर संख्या</label><input id="editStageWorkers" type="number" min="0" value="${r.workers}"><label>कामाचे दिवस</label><input id="editStageDays" type="number" min="0" step="0.5" value="${r.days}"><label>नोंद</label><input id="editStageNote" value="${esc(r.note||"")}"><button class="primary" onclick="updateStageLabour('${esc(plotId)}','${esc(stage)}')">अपडेट करा</button> <button class="secondary" onclick="closeModal()">रद्द</button>`)}
function updateStageLabour(plotId,stage){let r=state.stageLabour[plotId+"|"+stage],w=Number(document.getElementById("editStageWorkers").value),d=Number(document.getElementById("editStageDays").value);if(w<=0||d<=0){alert("मजूर व दिवस शून्यापेक्षा जास्त असावेत");return}Object.assign(r,{workers:w,days:d,labourDays:w*d,note:document.getElementById("editStageNote").value});save();closeModal();render("crops")}
function deleteStageLabour(plotId,stage){if(confirm("ही मजूर गरज नोंद काढायची?")){delete state.stageLabour[plotId+"|"+stage];save();render("crops")}}
function toggleWageFields(){let type=document.getElementById("workerType").value;document.getElementById("dailyWageField").classList.toggle("hide",type!=="daily");document.getElementById("monthlyWageField").classList.toggle("hide",type!=="monthly");document.getElementById("contractWageField").classList.toggle("hide",type!=="contract")}
function monthKey(d){return String(d||TODAY).slice(0,7)}
function workerPayroll(w,month=monthKey(TODAY)){
 const rows=state.attendance.filter(a=>a.workerId===w.id&&monthKey(a.date)===month);
 if(workerType(w)==="daily") return rows.reduce((sum,a)=>sum+Number(a.wage||0),0);
 if(workerType(w)==="contract") return rows.reduce((sum,a)=>sum+Number(a.contractPay||0),0);
 const absent=rows.reduce((sum,a)=>sum+(a.status==="Absent"?1:a.status==="Half"?0.5:0),0);
 const salary=Number(w.monthlySalary||w.wage||0),divisor=Math.max(1,Number(w.monthDivisor||30));
 return Math.max(0,salary-(absent*salary/divisor));
}
function workerPaid(w,month=monthKey(TODAY)){return (state.wagePayments||[]).filter(p=>p.workerId===w.id&&monthKey(p.date)===month).reduce((a,p)=>a+Number(p.amount||0),0)}
function addWorker(){let n=document.getElementById("workerName").value.trim(),type=document.getElementById("workerType").value,plot=document.getElementById("workerPlot").value.trim();if(!n){alert("नाव लिहा");return}let gender=document.getElementById("workerGender").value;let w={id:Date.now(),name:n,gender,wageType:type,plot};if(type==="monthly"){w.monthlySalary=Number(document.getElementById("workerMonthlySalary").value||0);w.monthDivisor=Number(document.getElementById("workerDivisor").value||30);if(w.monthlySalary<=0){alert("मासिक पगार टाका");return}}else if(type==="contract"){w.contractRate=Number(document.getElementById("workerContractRate").value||0);w.contractUnit=document.getElementById("workerContractUnit").value.trim();if(w.contractRate<=0||!w.contractUnit){alert("कंत्राटाची रक्कम आणि कामाचे वर्णन भरा");return}}else{w.dailyRate=Number(document.getElementById("workerDailyRate").value||0);if(w.dailyRate<=0){alert("दैनिक मजुरी टाका");return}}state.workers.push(w);save();render("workers")}
function workerList(){if(!state.workers.length)return `<div class="empty">अजून मजूर जोडलेले नाहीत.</div>`;return state.workers.map(w=>{let monthly=workerType(w)==="monthly",contract=workerType(w)==="contract",due=workerPayroll(w),paid=workerPaid(w),balance=Math.max(0,due-paid);return `<div class="task"><div class="tasktop"><b>${esc(w.name)}</b><span class="tag">${w.gender==="female"?"महिला":"पुरुष"} • ${monthly?"मासिक पगार":contract?"कंत्राटी मजुरी":"रोजंदारी"}</span></div><div class="muted">${monthly?`मासिक ₹${fmt(w.monthlySalary||w.wage)} • गैरहजेरी वजा • divisor ${w.monthDivisor||30}`:contract?`कंत्राट ₹${fmt(w.contractRate)} • ${esc(w.contractUnit||"")}`:`दैनिक ₹${fmt(w.dailyRate||w.wage)}`} ${w.plot?`• प्लॉट ${esc(w.plot)}`:""}</div><div style="margin:7px 0">या महिन्याचे देय: <b>₹${fmt(due)}</b> • दिले: ₹${fmt(paid)} • बाकी: <b>₹${fmt(balance)}</b></div><div class="row"><button class="primary smallbtn" onclick="markAttendance(${w.id},'Present')">हजर</button><button class="secondary smallbtn" onclick="markAttendance(${w.id},'Half')">अर्धा दिवस</button><button class="secondary smallbtn" onclick="markAttendance(${w.id},'Absent')">गैरहजर</button></div><div class="row" style="margin-top:7px"><button class="secondary smallbtn" onclick="recordWagePayment(${w.id})">पगार / अॅडव्हान्स द्या</button><button class="danger smallbtn" onclick="removeWorker(${w.id})">काढा</button></div></div>`}).join("")}
function markAttendance(id,status){let w=state.workers.find(x=>x.id===id);if(!w)return;let prior=state.attendance.find(a=>a.workerId===id&&a.date===TODAY);if(prior&&(prior.wage||prior.contractPay)){let oldAmount=Number(prior.wage||prior.contractPay);let oldNote=workerType(w)==="contract"?w.name+" - कंत्राट":w.name;let ix=state.expenses.findIndex(e=>e.type==="मजुरी"&&e.note===oldNote&&e.date===TODAY&&Number(e.amount)===oldAmount);if(ix>=0)state.expenses.splice(ix,1)}let reason="",contractPay=0;if(status==="Absent"){reason=prompt("गैरहजेरीचे कारण (ऐच्छिक)\nउदा. आजारपण, वैयक्तिक काम, पूर्वसूचना, संपर्क झाला नाही",prior?.absenceReason||"")||""}if(workerType(w)==="contract"&&status!=="Absent"){let suggested=status==="Half"?Number(w.contractRate||0)/2:Number(w.contractRate||0);contractPay=Number(prompt("या कामासाठी कंत्राटी देय रक्कम (₹) भरा",String(suggested))||0);if(contractPay<0||!Number.isFinite(contractPay)){alert("योग्य रक्कम भरा");return}}state.attendance=state.attendance.filter(a=>!(a.workerId===id&&a.date===TODAY));let wage=workerType(w)==="daily"?(status==="Present"?Number(w.dailyRate||w.wage||0):status==="Half"?Number(w.dailyRate||w.wage||0)/2:0):0;state.attendance.push({workerId:id,name:w.name,status,date:TODAY,wage,contractPay,absenceReason:reason,plot:w.plot||""});if(wage)state.expenses.push({type:"मजुरी",amount:wage,note:w.name,date:TODAY});if(contractPay)state.expenses.push({type:"मजुरी",amount:contractPay,note:w.name+" - कंत्राट",date:TODAY});save();render("workers")}
function recordWagePayment(id){let w=state.workers.find(x=>x.id===id);if(!w)return;let due=workerPayroll(w),paid=workerPaid(w),balance=Math.max(0,due-paid);openModal(`<h3>${esc(w.name)} — पगार नोंद</h3><p class="muted">या महिन्याचे देय ₹${fmt(due)} • आधी दिले ₹${fmt(paid)} • बाकी ₹${fmt(balance)}</p><label>रक्कम (₹) — अॅडव्हान्स असल्यास तीही नोंदवा</label><input id="wagePayAmount" type="number" min="0" step="0.01" value="${balance}"><label>दिनांक</label><input id="wagePayDate" type="date" value="${TODAY}"><label>प्रकार</label><select id="wagePayType"><option value="salary">पगार पेमेंट</option><option value="advance">अॅडव्हान्स</option></select><label>नोंद</label><input id="wagePayNote" placeholder="ऐच्छिक"><div class="row"><button class="secondary" onclick="closeModal()">रद्द</button><button class="primary" onclick="saveWagePayment(${id})">पेमेंट सेव्ह</button></div>`)}
function saveWagePayment(id){let amount=Number(document.getElementById("wagePayAmount").value||0);if(amount<=0){alert("योग्य रक्कम टाका");return}let w=state.workers.find(x=>x.id===id),date=document.getElementById("wagePayDate").value,type=document.getElementById("wagePayType").value;state.wagePayments=state.wagePayments||[];state.wagePayments.push({id:Date.now(),workerId:id,name:w.name,amount,date,type,note:document.getElementById("wagePayNote").value});if(workerType(w)==="monthly"||type==="advance")state.expenses.push({type:"मजुरी",amount,note:`${w.name} - ${type==="advance"?"अॅडव्हान्स":"पगार"}`,date});save();closeModal();render("workers")}
function wagePaymentList(){let rows=(state.wagePayments||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,12);return rows.length?rows.map(p=>`<div class="task">${esc(p.name)} • ${p.type==="advance"?"अॅडव्हान्स":"पगार"}<span class="tag">₹${fmt(p.amount)}</span><div class="muted">${dateFmt(p.date)} ${p.note?"• "+esc(p.note):""}</div></div>`).join(""):`<div class="muted">अजून पेमेंट नोंदी नाहीत.</div>`}
function attendanceList(){let a=state.attendance.filter(x=>x.date===TODAY);return a.length?a.map(x=>`<div class="task">${esc(x.name)} — ${x.status==="Present"?"हजर":x.status==="Half"?"अर्धा दिवस":"गैरहजर"} <span class="tag">₹${fmt(x.wage||x.contractPay||0)}</span>${x.absenceReason?`<div class="muted">गैरहजेरीचे कारण: ${esc(x.absenceReason)}</div>`:""}</div>`).join(""):`<div class="muted">आजची हजेरी नोंदलेली नाही.</div>`}
function removeWorker(id){if(confirm("हा मजूर काढायचा? जुने हजेरी व पेमेंट रेकॉर्ड कायम राहतील.")){state.workers=state.workers.filter(w=>w.id!==id);save();render("workers")}}
function expenseRegister(){let rows=(state.expenses||[]).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));if(!rows.length)return `<div class="empty">अजून खर्च नोंदवलेला नाही.</div>`;return `<div class="panel"><div class="muted">एकूण नोंदवलेला खर्च: ₹${fmt(rows.reduce((a,e)=>a+Number(e.amount||0),0))}</div>${rows.slice(0,100).map(e=>`<div class="task"><div class="tasktop"><b>${esc(e.type||"इतर")} • ₹${fmt(e.amount)}</b><span class="tag">${dateFmt(e.date)}</span></div><div class="muted">${esc(e.note||"")}</div></div>`).join("")}</div>`}
function addExpense(){let a=Number(document.getElementById("expenseAmount").value);if(a<=0){alert("रक्कम टाका");return}state.expenses.push({type:document.getElementById("expenseType").value,amount:a,note:document.getElementById("expenseNote").value,date:TODAY});save();render("reports")}
function exportCSV(){let rows=[["Date","Plot","Activity","Item","Planned Qty","Unit","Status","Actual Qty","Note"],...SOURCE.schedule.map(x=>[x.date,x.plot,x.activity,x.item,x.qty,x.unit,taskStatus(x.id)?"Done":"Pending",state.tasks[x.id]?.actualQty||"",state.tasks[x.id]?.note||""])];let csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");download("\ufeff"+csv,"vineyard_schedule_report.csv","text/csv")}
function backup(){
 const payload={app:"Vineyard Manager",version:7,exportedAt:new Date().toISOString(),state};
 download(JSON.stringify(payload,null,2),"vineyard_manager_backup.json","application/json");
}
function restoreBackup(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{try{
  const parsed=JSON.parse(String(reader.result||""));
  const restored=parsed&&parsed.state?parsed.state:parsed;
  if(!restored||typeof restored!=="object"||!restored.stock||!restored.tasks||!Array.isArray(restored.workers)||!Array.isArray(restored.attendance)||!Array.isArray(restored.expenses)||!Array.isArray(restored.purchases))throw new Error("invalid");
  restored.workers=restored.workers.map(w=>{if(!w.wageType){w.wageType="daily";w.dailyRate=Number(w.wage||0)}return w});restored.wagePayments=restored.wagePayments||[];restored.crops=restored.crops||["द्राक्ष","इतर पीक"];["कांदा","टोमॅटो","ज्वारी","कलिंगड"].forEach(c=>{if(!restored.crops.includes(c))restored.crops.push(c)});restored.plots=restored.plots||defaultPlots();restored.plots.filter(p=>p.kind==="other").forEach((p,i)=>{if(!p.crop||p.crop==="इतर पीक")p.crop=["कांदा","टोमॅटो","ज्वारी","कलिंगड"][i]||"इतर पीक"});restored.stageLabour=restored.stageLabour||{};restored.cropHarvest=restored.cropHarvest||{};restored.cropExpenses=restored.cropExpenses||[];
  if(!confirm("या डिव्हाइसवरील सध्याचा डेटा बदलून बॅकअप Restore करायचा का? आधी सध्याचा बॅकअप डाउनलोड करा."))return;
  state=restored;save();alert("बॅकअप यशस्वीपणे Restore झाला.");render("home");
 }catch(e){alert("ही योग्य Vineyard Manager बॅकअप फाइल नाही. योग्य JSON बॅकअप निवडा.");}
 };
 reader.onerror=()=>alert("फाइल वाचता आली नाही. पुन्हा प्रयत्न करा.");reader.readAsText(file);
}
function download(data,name,type){
 const blob=new Blob([data],{type}),u=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=u;a.download=name;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function openModal(html){let m=document.getElementById("modal");m.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`;m.classList.remove("hide")}
function closeModal(){document.getElementById("modal").classList.add("hide")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
let currentTabName="home";function currentTab(){return document.querySelector("#nav button.active")?.dataset.tab||"home"}

/* ================= CLOUD SYNC (Firebase Auth + Firestore) ================= */
(function(){
 const CFG_KEY="vm_firebase_config",CID_KEY="vm_client_id";
 const SDK="https://www.gstatic.com/firebasejs/10.14.1/";
 const KEYS=["tasks","stock","workers","attendance","expenses","purchases","wagePayments","crops","plots","stageLabour","cropHarvest","cropExpenses","cropIncome"];
 let cid=localStorage.getItem(CID_KEY);if(!cid){cid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(CID_KEY,cid)}
 let fb=null,user=null,docRef=null,unsub=null,timer=null,ready=false,lastSynced={},status="offline",msg="";
 const $=id=>document.getElementById(id);
 function setStatus(s,m){status=s;msg=m||"";const b=$("syncBtn");if(b)b.textContent=({off:"☁ Sync",on:"☁ ✓ Synced",busy:"☁ …",err:"☁ ⚠"})[s]||"☁ Sync";}
 function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY))}catch(e){return null}}
 function parseCfg(txt){
  txt=String(txt||"").trim();
  const o={};["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"].forEach(k=>{const m=txt.match(new RegExp(k+"\\s*[\"']?\\s*:\\s*[\"']([^\"']+)[\"']"));if(m)o[k]=m[1]});
  if(!o.apiKey||!o.projectId||!o.appId)return null;return o;
 }
 async function loadSdk(){
  if(fb)return fb;
  const [app,auth,fs]=await Promise.all([import(SDK+"firebase-app.js"),import(SDK+"firebase-auth.js"),import(SDK+"firebase-firestore.js")]);
  fb={app,auth,fs};return fb;
 }
 async function start(){
  const cfg=getCfg();if(!cfg){setStatus("off");return}
  try{
   setStatus("busy");await loadSdk();
   const {app,auth,fs}=fb;
   if(!fb.a){fb.a=app.initializeApp(cfg);fb.auth_=auth.getAuth(fb.a);
    try{fb.db=fs.initializeFirestore(fb.a,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){fb.db=fs.getFirestore(fb.a)}
    auth.onAuthStateChanged(fb.auth_,u=>{user=u;if(u)attach(u);else{detach();setStatus("off")}});
   }
  }catch(e){setStatus("err","इंटरनेट/Firebase लोड झाले नाही");}
 }
 function detach(){if(unsub){unsub();unsub=null}ready=false;docRef=null}
 function attach(u){
  detach();const {fs}=fb;docRef=fs.doc(fb.db,"farms","shared");setStatus("busy");
  unsub=fs.onSnapshot(docRef,snap=>{
   if(!snap.exists()){ if(!snap.metadata.fromCache){ready=true;lastSynced={};pushNow(true)} return }
   const d=snap.data();let changed=false;
   if(!ready){ // first load after sign-in
    const remoteHas=KEYS.some(k=>d["k_"+k]!==undefined);
    const localHasData=state.workers.length||state.attendance.length||state.expenses.length||state.purchases.length||state.cropExpenses.length||Object.keys(state.tasks).length;
    if(remoteHas&&localHasData&&!snap.metadata.hasPendingWrites&&JSON.stringify(KEYS.map(k=>d["k_"+k]||null))!==JSON.stringify(KEYS.map(k=>JSON.stringify(state[k])))){
     if(!confirm("क्लाउडवर आधीच डेटा आहे. या फोनचा डेटा क्लाउडच्या डेटाने बदलायचा का?\n\nOK = क्लाउडचा डेटा घ्या\nCancel = या फोनचा डेटा क्लाउडवर टाका")){ready=true;lastSynced={};pushNow(true);return}
    }
    ready=true;
   }
   if(snap.metadata.hasPendingWrites)return; // our own local write echo
   KEYS.forEach(k=>{const r=d["k_"+k];if(r===undefined)return;lastSynced[k]=r;
    if(r!==JSON.stringify(state[k])&&!(dirty[k])){try{state[k]=JSON.parse(r);changed=true}catch(e){}}});
   if(changed){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
    const busy=document.querySelector("#modal:not(.hide)")||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"");
    if(!busy)render(currentTab());}
   setStatus("on");
  },err=>{setStatus("err",String(err.code||err.message))});
 }
 const dirty={};
 function pushSoon(){
  KEYS.forEach(k=>{if(JSON.stringify(state[k])!==lastSynced[k])dirty[k]=true});
  clearTimeout(timer);timer=setTimeout(()=>pushNow(false),700);
 }
 async function pushNow(all){
  if(!docRef||!ready)return;
  const {fs}=fb,payload={_by:cid,_at:Date.now()},sent=[];
  KEYS.forEach(k=>{const j=JSON.stringify(state[k]);if(all||j!==lastSynced[k]){payload["k_"+k]=j;sent.push([k,j])}});
  if(!sent.length)return;
  try{await fs.setDoc(docRef,payload,{merge:true});sent.forEach(([k,j])=>{lastSynced[k]=j;delete dirty[k]});setStatus("on")}
  catch(e){setStatus("err",String(e.code||e.message))}
 }
 window.cloudPush=function(){if(docRef)pushSoon()};
 window.addEventListener("online",()=>{if(getCfg())start();if(docRef)pushSoon()});

 // ---------- UI ----------
 window.openSync=function(){
  const cfg=getCfg();
  if(!cfg){
   openModal(`<div class="section">☁ क्लाउड Sync चालू करा</div><p class="muted">सर्व फोनवर एकच डेटा दिसण्यासाठी Firebase जोडा. Firebase Console मधील firebaseConfig येथे paste करा (FIREBASE_SETUP.md पहा).</p><label>firebaseConfig</label><textarea id="fbCfg" rows="8" style="width:100%;font-size:13px;padding:8px;border:1px solid #cbd8ce;border-radius:9px" placeholder='const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." };'></textarea><div class="row"><button class="primary" onclick="saveFbCfg()">सेव्ह करा</button><button class="secondary" onclick="closeModal()">बंद करा</button></div>`);return;
  }
  if(!user){
   openModal(`<div class="section">☁ लॉगिन</div><p class="muted">सर्व फोनवर एकच ईमेल व पासवर्ड वापरा. पहिल्यांदा "नवीन खाते" दाबा.</p><label>ईमेल</label><input id="fbEmail" type="email" autocomplete="email"><label>पासवर्ड (किमान ६ अक्षरे)</label><input id="fbPass" type="password" autocomplete="current-password"><div class="row"><button class="primary" onclick="fbSign(false)">लॉगिन</button><button class="secondary" onclick="fbSign(true)">नवीन खाते</button></div><div id="fbErr" class="muted" style="color:#b42318;margin-top:6px">${esc(msg)}</div><div class="row" style="margin-top:10px"><button class="secondary smallbtn" onclick="resetFbCfg()">Firebase config बदला</button><button class="secondary smallbtn" onclick="closeModal()">बंद करा</button></div>`);return;
  }
  openModal(`<div class="section">☁ Sync स्थिती</div><div class="panel"><b>${esc(user.email)}</b><br><span class="muted">${status==="on"?"✓ क्लाउडशी जोडलेले — बदल सर्व फोनवर दिसतील":status==="err"?"⚠ "+esc(msg):"जोडणी सुरू आहे…"}</span></div><p class="muted">ऑफलाइन असताना केलेले बदल इंटरनेट आल्यावर आपोआप अपलोड होतात.</p><div class="row"><button class="secondary" onclick="fbForce()">आता पुन्हा अपलोड करा</button><button class="danger" onclick="fbOut()">लॉगआउट</button></div><div class="row" style="margin-top:8px"><button class="secondary smallbtn" onclick="closeModal()">बंद करा</button></div>`);
 };
 window.saveFbCfg=function(){const c=parseCfg($("fbCfg").value);if(!c){alert("config वाचता आली नाही. apiKey, projectId, appId असलेला पूर्ण भाग paste करा.");return}
  localStorage.setItem(CFG_KEY,JSON.stringify(c));closeModal();start().then(()=>openSync());setTimeout(openSync,600)};
 window.resetFbCfg=function(){if(confirm("Firebase config काढायची का?")){localStorage.removeItem(CFG_KEY);location.reload()}};
 window.fbSign=async function(create){
  const e=$("fbEmail").value.trim(),p=$("fbPass").value;if(!e||p.length<6){$("fbErr").textContent="ईमेल व किमान ६ अक्षरांचा पासवर्ड टाका.";return}
  try{await loadSdk();const a=fb.auth;$("fbErr").textContent="…";
   if(create)await a.createUserWithEmailAndPassword(fb.auth_,e,p);else await a.signInWithEmailAndPassword(fb.auth_,e,p);
   closeModal();
  }catch(err){const m={"auth/email-already-in-use":"हे खाते आधीच आहे — 'लॉगिन' दाबा.","auth/invalid-credential":"ईमेल किंवा पासवर्ड चुकीचा.","auth/wrong-password":"पासवर्ड चुकीचा.","auth/user-not-found":"खाते नाही — 'नवीन खाते' दाबा.","auth/weak-password":"पासवर्ड कमकुवत आहे.","auth/network-request-failed":"इंटरनेट नाही.","auth/operation-not-allowed":"Firebase मध्ये Email/Password sign-in चालू करा."}[err.code]||err.code||String(err);$("fbErr").textContent=m}
 };
 window.fbOut=async function(){if(!confirm("लॉगआउट करायचे? या फोनवरचा डेटा तसाच राहील."))return;await fb.auth.signOut(fb.auth_);closeModal()};
 window.fbForce=function(){lastSynced={};pushNow(true);closeModal()};
 start();
})();
render();
if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
</script></body></html>
