function taskList(items){
 if(!items.length)return `<div class="empty">या तारखेला नियोजित काम नाही.</div>`;
 return items.map(x=>{let done=taskStatus(x.id);return `<div class="task ${done?'done':''}"><div class="tasktop"><b>${esc(x.activity||x.item)}</b><span class="tag ${done?'':'warn'}">${done?'पूर्ण':'बाकी'}</span></div><div class="muted">${esc(x.plot)} • ${esc(x.method)}</div><div style="margin:7px 0">${esc(x.item)} : <b>${fmt(x.qty)} ${esc(x.unit)}</b>${x.water?` • पाणी ${fmt(x.water)} L`:""}${(state.schedEdits||{})[x.id]?` <span class="tag warn" title="मूळ ${fmt(x.qty0)}">✎ बदललेले (मूळ ${fmt(x.qty0)})</span>`:""}</div><div class="row"><button class="${done?'secondary':'primary'} smallbtn" onclick="completeTask(${x.id})">${done?'पूर्ण नोंद बदल':'काम पूर्ण करा'}</button><button class="secondary smallbtn" onclick="taskDetails(${x.id})">तपशील</button>${done?"":`<button class="secondary smallbtn" onclick="editQty(${x.id})">✎ प्रमाण</button>`}</div></div>`}).join("");
}

function rowAcres(x){let m=String(x.plot).match(/\(([\d.]+)\s*Acres?\)/i);return m?Number(m[1]):0}
function seNear(x){return SOURCE.schedule.filter(r=>r.relativeDay===x.relativeDay&&r.item===x.item&&(r.activity||"")===(x.activity||"")&&!taskStatus(r.id))}
function recalcNeedFor(name){state.stock.forEach(e=>{if(!isGrape(e)||e.name!==name)return;let sum=0;SOURCE.schedule.forEach(r=>{if(r.item!==name)return;let f=uConv(r.unit,e.unit);if(f!==null)sum+=Number(r.qty||0)*f});sum=Math.round(sum*100)/100;let old=Number(e.required||0);e.required=sum;if(e.recommended!==undefined&&Math.abs(Number(e.recommended)-old)<0.01)e.recommended=sum})}
function seCalc(id,src){let x=SOURCE.schedule.find(r=>r.id===id),ac=rowAcres(x),ppm=String(x.unit).toUpperCase()==="PPM",q=document.getElementById("se_q"),a=document.getElementById("se_a");if(src==="a"&&ac>0&&!ppm)q.value=Math.round(Number(a.value||0)*ac*100)/100;else if(src==="q"&&a&&ac>0&&!ppm)a.value=Math.round(Number(q.value||0)/ac*10000)/10000;sePrev(id)}

function editQty(id){let x=SOURCE.schedule.find(r=>r.id===id);if(!x)return;if(taskStatus(id)){alert("हे काम पूर्ण आहे — त्याचे प्रमाण बदलता येत नाही.");return}let ac=rowAcres(x),ppm=String(x.unit).toUpperCase()==="PPM",ed=(state.schedEdits||{})[id],n=seNear(x).length;
 openModal(`<h3>✎ प्रमाण बदला</h3><p><b>${esc(x.item)}</b> • ${esc(x.activity||"")} • दिवस ${x.relativeDay}<br><span class="muted">${esc(x.plot)} • ${esc(x.date)}</span></p>${ed?`<div class="muted" style="color:#a76d00">मूळ प्रमाण: ${fmt(x.qty0)} ${esc(x.unit)}${x.water0?" • पाणी "+fmt(x.water0)+" L":""}</div>`:""}

 <div id="se_prev" class="muted" style="margin:8px 0;max-height:150px;overflow:auto"></div>

function saveQty(id){let x=SOURCE.schedule.find(r=>r.id===id),q=Number(document.getElementById("se_q").value),w=document.getElementById("se_w").value,ac=rowAcres(x),ppm=String(x.unit).toUpperCase()==="PPM",all=document.getElementById("se_all")?.checked;if(!(q>=0)||document.getElementById("se_q").value===""){alert("प्रमाण भरा");return}

 rows.forEach(r=>{let a=rowAcres(r),nq=r.id===id?q:(ppm?q:(ac>0&&a>0?q/ac*a:r.qty)),nw=r.id===id?w:(w!==undefined&&ac>0&&a>0?w/ac*a:r.water);nq=Math.round(nq*100)/100;if(nw!==undefined)nw=Math.round(nw*100)/100;

function filterStock(){let q=document.getElementById("stockSearch").value.toLowerCase();document.getElementById("stockResults").innerHTML=stockTable(state.stock.filter(s=>s.name.toLowerCase().includes(q)))}
function editStock(i){let s=state.stock[i],cost=Math.round(unitCostFor(s)*10000)/10000;openModal(`<h3>${esc(s.name)}</h3><label>उपलब्ध साठा — प्रत्यक्ष प्रमाण (${esc(s.unit)})</label><input id="availableQty" type="number" min="0" step="any" value="${balance(s)}"><label>प्रति युनिट किंमत (₹/${esc(s.unit)})</label><input id="manualUnitCost" type="number" min="0" step="0.01" value="${cost}"><label>खर्चाचा प्रकार</label><select id="stockCategory">${typeOptions(categoryFor(s))}</select><label>शिफारस केलेला साठा (${esc(s.unit)})</label><input id="recommended" type="number" min="0" step="any" value="${Number(s.recommended??s.required??0)}"><p class="muted">उपलब्ध साठा आणि प्रति युनिट किंमत स्वतंत्रपणे बदलता येतात. खरेदी व प्रत्यक्ष वापराच्या नोंदी पुढेही लागू राहतील.</p><div class="card" style="padding:9px 10px;margin:10px 0"><b>वापर नोंदवा</b><div class="row"><input id="useQty" type="number" min="0" step="any" placeholder="वापरलेले प्रमाण (${esc(s.unit)})"><button class="secondary" onclick="useStock(${i})">वापर वजा करा</button></div></div><label>पीक</label><select id="stockCrop">${(state.crops||["द्राक्ष"]).map(c=>`<option ${c===(isGrape(s)?"द्राक्ष":s.crop)?"selected":""}>${esc(c)}</option>`).join("")}</select>${unitChangeBox(s,i)}<button class="primary" onclick="saveStock(${i})">सेव्ह</button> <button class="secondary" onclick="closeModal()">रद्द</button>`)}
function cropChips(){let cs=["द्राक्ष"].concat((state.crops||[]).filter(c=>c!=="द्राक्ष"&&state.stock.some(e=>e.crop===c)));if(cs.length<2&&STK_CROP==="all")return "";let chip=(k,l)=>`<span onclick="setStkCrop('${k}')" style="display:inline-block;padding:6px 11px;border-radius:16px;font-size:12px;font-weight:700;margin:0 5px 6px 0;border:1px solid ${STK_CROP===k?"#2b6cb0":"#cfd9d2"};background:${STK_CROP===k?"#2b6cb0":"white"};color:${STK_CROP===k?"white":"inherit"}">${l}</span>`;return `<div>${chip("all","🌿 सर्व पिके")}${cs.map(c=>chip(c,esc(c)+" "+state.stock.filter(e=>c==="द्राक्ष"?isGrape(e):e.crop===c).length)).join("")}</div>`}
function newItemForm(){let crops=(state.crops||["द्राक्ष"]);openModal(`<h3>नवीन वस्तू जोडा</h3><label>वस्तूचे नाव</label><input id="niName" placeholder="उदा. Urea, Roundup"><label>पीक</label><select id="niCrop">${crops.map(c=>`<option ${c===(STK_CROP!=="all"?STK_CROP:"")?"selected":""}>${esc(c)}</option>`).join("")}</select><label>एकक</label><select id="niUnit"><option>KG</option><option>GM</option><option>LITER</option><option>ML</option><option>नग</option><option>बॅग</option></select><label>खर्चाचा प्रकार</label><select id="niCat">${typeOptions("खते")}</select><label>आधीपासून असलेला साठा (ऐच्छिक)</label><input id="niQty" type="number" min="0" step="any" placeholder="0"><label>प्रति युनिट दर ₹ (ऐच्छिक)</label><input id="niRate" type="number" min="0" step="0.01"><p class="muted">नवीन खरेदी केल्यावर "＋ खरेदी नोंदवा" वापरा — साठा वाढेल आणि खर्चही नोंदला जाईल.</p><button class="primary" onclick="saveNewItem()">सेव्ह</button> <button class="secondary" onclick="closeModal()">रद्द</button>`)}
function saveNewItem(){let nm=(document.getElementById("niName").value||"").trim(),cr=document.getElementById("niCrop").value,un=document.getElementById("niUnit").value;if(!nm){alert("वस्तूचे नाव भरा");return}

 let e={name:nm,unit:un,required:0,opening:Math.max(0,Number(document.getElementById("niQty").value||0)),received:0,used:0,minimum:0,recommended:0,category:document.getElementById("niCat").value};let r=Number(document.getElementById("niRate").value||0);if(r>0)e.lastUnitCost=r;if(cr!=="द्राक्ष")e.crop=cr;
 state.stock.push(e);if(cr!=="द्राक्ष"){STK_CAT="crop:"+cr;STK_S="all"}save();closeModal();render("stock")}
function useStock(i){let s=state.stock[i],q=Number(document.getElementById("useQty").value||0);if(!(q>0)){alert("वापरलेले प्रमाण भरा");return}if(q>balance(s)&&!confirm("वापर साठ्यापेक्षा जास्त आहे — साठा उणे होईल. तरीही?"))return;s.used=Number(s.used||0)+q;save();closeModal();render("stock")}
function unitChangeBox(s,i){let b=UNIT_BASE[uU(s.unit)];if(!b)return "";let opts=(b[0]==="m"?["KG","GM"]:["LITER","ML"]).filter(u=>u!==uU(s.unit));return `<div class="card" style="padding:9px 10px;margin:10px 0"><b>एकक बदला</b><div class="muted" style="margin:3px 0 6px">सध्याचे एकक: ${esc(s.unit)}. बदलल्यास साठा, आवक, वापर व किंमत आपोआप नवीन एककात रूपांतरित होते (उदा. 1 KG = 1000 GM).</div><div class="row"><select id="stockUnitSel">${opts.map(u=>`<option>${u}</option>`).join("")}</select><button class="secondary" onclick="changeStockUnit(${i})">एकक बदला</button></div></div>`}
function changeStockUnit(i){let s=state.stock[i],nu=document.getElementById("stockUnitSel")?.value,f=uConv(s.unit,nu);if(!nu||f===null||f===1)return;if(!confirm(s.name+": एकक "+s.unit+" → "+nu+" करायचे? सर्व प्रमाणे रूपांतरित होतील."))return;
 (SOURCE.schedule||[]).forEach(x=>{if(x.item!==s.name||stockFor(x.item,x.unit)!==s)return;let r=state.tasks&&state.tasks[x.id];if(r&&r.done&&r.stockQty!==undefined)r.stockQty=Math.round(Number(r.stockQty)*f*1e6)/1e6});
 ["opening","received","used","required","recommended","minimum"].forEach(k=>{if(s[k]!==undefined)s[k]=Math.round(Number(s[k]||0)*f*1e6)/1e6});
 if(Number(s.lastUnitCost)>0)s.lastUnitCost=Number(s.lastUnitCost)/f;s.unit=nu;save();editStock(i);render("stock")}
function saveStock(i){let s=state.stock[i],available=Math.max(0,Number(document.getElementById("availableQty").value||0));s.opening=available-Number(s.received||0)+Number(s.used||0);s.lastUnitCost=Math.max(0,Number(document.getElementById("manualUnitCost").value||0));s.recommended=Math.max(0,Number(document.getElementById("recommended").value||0));s.minimum=s.minimum||0;s.category=document.getElementById("stockCategory").value;{let c=document.getElementById("stockCrop")?.value;if(c&&!(isGrape(s)&&SOURCE.schedule.some(r=>r.item===s.name))){if(c==="द्राक्ष")delete s.crop;else s.crop=c}}save();closeModal();render("stock")}
function openPurchase(){openModal(`<h3>खरेदी नोंदवा</h3><label>वस्तू (यादीतून)</label><select id="purchaseItem" onchange="syncPurchaseType()">${state.stock.map((s,i)=>`<option value="${i}">${esc(s.name)} (${esc(s.unit)})${isGrape(s)?"":" — "+esc(s.crop)}</option>`).join("")}</select><label>किंवा यादीत नसलेली नवीन वस्तू — नाव</label><input id="purchaseNewName" placeholder="ऐच्छिक — नवीन वस्तूचे नाव" oninput="syncPurchaseType()"><label>नवीन वस्तूचे युनिट</label><select id="purchaseNewUnit" onchange="syncPurchaseType()"><option>KG</option><option>GM</option><option>LITER</option><option>ML</option><option>नग</option></select><label>खर्चाचा प्रकार</label><select id="purchaseExpenseType">${typeOptions("खते")}</select><label id="purchaseQtyLabel">खरेदी प्रमाण</label><input id="purchaseQty" type="number" min="0" step="any" oninput="purchasePreview()"><label id="purchaseRateLabel">प्रति युनिट दर (₹) — ऐच्छिक</label><input id="purchaseRate" type="number" min="0" step="0.01" placeholder="दर भरल्यास एकूण किंमत आपोआप होईल" oninput="purchasePreview()"><label>एकूण खरेदी किंमत (₹)</label><input id="purchaseCost" type="number" min="0" step="0.01" placeholder="एकूण बिल रक्कम" oninput="purchasePreview()"><div id="purchasePreview" class="muted" style="margin:6px 0"></div><label>दिनांक</label><input id="purchaseDate" type="date" value="${TODAY}"><button class="primary" onclick="savePurchase()">खरेदी सेव्ह करा</button> <button class="secondary" onclick="closeModal()">रद्द</button>`);syncPurchaseType();purchasePreview()}
function openPurchaseFor(i){let s=state.stock[i];if(!s)return;closeModal();openPurchase();let sel=document.getElementById("purchaseItem");if(sel){sel.value=String(i);syncPurchaseType()}let q=document.getElementById("purchaseQty");if(q){q.value=Math.max(0,Math.ceil(-balance(s)*100)/100)||"";purchasePreview()}}
function syncPurchaseType(){let nm=(document.getElementById("purchaseNewName")?.value||"").trim(),sel=document.getElementById("purchaseExpenseType");if(!sel)return;let cat=nm?guessCategory(nm):categoryFor(state.stock[Number(document.getElementById("purchaseItem").value)]);sel.value=cat;let u=nm?document.getElementById("purchaseNewUnit").value:(state.stock[Number(document.getElementById("purchaseItem").value)]?.unit||"");let a=document.getElementById("purchaseQtyLabel"),b=document.getElementById("purchaseRateLabel");if(a)a.textContent="खरेदी प्रमाण ("+u+")";if(b)b.textContent="प्रति युनिट दर (₹ / "+u+") — ऐच्छिक";purchasePreview()}
function purchaseTotal(){let q=Number(document.getElementById("purchaseQty")?.value||0),r=Number(document.getElementById("purchaseRate")?.value||0),c=Number(document.getElementById("purchaseCost")?.value||0);return {q,total:c>0?c:(q>0&&r>0?Math.round(q*r*100)/100:0)}}
function purchasePreview(){let el=document.getElementById("purchasePreview");if(!el)return;let {q,total}=purchaseTotal(),type=document.getElementById("purchaseExpenseType")?.value||"";el.innerHTML=total>0?`एकूण खर्च: <b>₹${fmt(total)}</b> → <b>${esc(type)}</b> खर्चात जमा होईल${q>0?` • दर ₹${fmt(total/q)}/युनिट`:""}`:"प्रमाण आणि किंमत (किंवा दर) भरा."}
function savePurchase(){let sel=Number(document.getElementById("purchaseItem").value),newName=(document.getElementById("purchaseNewName").value||"").trim(),{q,total:c}=purchaseTotal(),date=document.getElementById("purchaseDate").value||TODAY,type=document.getElementById("purchaseExpenseType").value;if(!(q>0)||!(c>=0)){alert("योग्य खरेदी प्रमाण आणि किंमत भरा");return}let s;if(newName){s=state.stock.find(x=>isGrape(x)&&x.name.toLowerCase()===newName.toLowerCase());if(!s){s={name:newName,unit:document.getElementById("purchaseNewUnit").value,required:0,opening:0,received:0,used:0,recommended:0};state.stock.push(s)}}else s=state.stock[sel];if(!s){alert("वस्तू निवडा");return}let unitCost=c/q,pid=Date.now();s.received=Number(s.received||0)+q;s.lastUnitCost=unitCost;s.category=type;state.purchases=state.purchases||[];state.expenses=state.expenses||[];state.purchases.push({id:pid,name:s.name,qty:q,unit:s.unit,cost:c,unitCost,expenseType:type,date,...(isGrape(s)?{}:{crop:s.crop})});if(c>0)state.expenses.push({id:pid+1,type,amount:c,note:"साठा खरेदी: "+s.name+" • "+fmt(q)+" "+s.unit+" • ₹"+fmt(unitCost)+"/"+s.unit,date,purchaseId:pid});save();closeModal();render("stock")}

function saveStageLabour(){let plotId=document.getElementById("stagePlot").value,stage=document.getElementById("stageName").value,workers=Number(document.getElementById("stageWorkers").value),days=Number(document.getElementById("stageDays").value||1),note=document.getElementById("stageNote").value.trim();if(!plotId||!stage||workers<=0||days<=0){alert("प्लॉट, टप्पा, मजूर संख्या आणि दिवस योग्य भरा");return}let key=plotId+"|"+stage;state.stageLabour[key]={plotId,stage,workers,days,labourDays:workers*days,note,updatedAt:TODAY};save();render("crops")}
function saveOtherStageLabour(){let plotId=document.getElementById("otherStagePlot").value,stage=document.getElementById("otherStageName").value,workers=Number(document.getElementById("otherStageWorkers").value),days=Number(document.getElementById("otherStageDays").value||1),note=document.getElementById("otherStageNote").value.trim();if(!plotId||!stage||workers<=0||days<=0){alert("प्लॉट, टप्पा, मजूर संख्या आणि दिवस योग्य भरा");return}let key=plotId+"|"+stage;state.stageLabour[key]={plotId,stage,crop:state.plots.find(p=>p.id===plotId)?.crop||"इतर पीक",workers,days,labourDays:workers*days,note,updatedAt:TODAY,cropStage:true};save();render("crops")}
function stageLabourTable(){let rows=Object.values(state.stageLabour||{});if(!rows.length)return `<div class="empty">अजून मजूर गरज नोंदवलेली नाही. वरील फॉर्ममधून प्रत्येक प्लॉटसाठी टप्पा निवडा.</div>`;return rows.sort((a,b)=>a.plotId.localeCompare(b.plotId)||a.stage.localeCompare(b.stage)).map(r=>{let p=state.plots.find(x=>x.id===r.plotId);return `<div class="task"><div class="tasktop"><b>${esc(p?.name||r.plotId)}</b><span class="tag">${r.workers} मजूर</span></div><div><span class="tag">${r.cropStage?esc(p?.crop||r.crop||"इतर पीक"):"द्राक्ष"}</span> ${esc(r.stage)}</div><div class="muted">कामाचे दिवस: ${fmt(r.days)} • एकूण मजूर-दिवस: <b>${fmt(r.labourDays)}</b>${r.note?" • "+esc(r.note):""}</div><button class="secondary smallbtn" onclick="editStageLabour('${esc(r.plotId)}','${esc(r.stage)}')">बदला</button> <button class="danger smallbtn" onclick="deleteStageLabour('${esc(r.plotId)}','${esc(r.stage)}')">काढा</button></div>`}).join("")}
function editStageLabour(plotId,stage){let r=state.stageLabour[plotId+"|"+stage];if(!r)return;openModal(`<h3>मजूर गरज बदला</h3><p>${esc(stage)}</p><label>मजूर संख्या</label><input id="editStageWorkers" type="number" min="0" value="${r.workers}"><label>कामाचे दिवस</label><input id="editStageDays" type="number" min="0" step="0.5" value="${r.days}"><label>नोंद</label><input id="editStageNote" value="${esc(r.note||"")}"><button class="primary" onclick="updateStageLabour('${esc(plotId)}','${esc(stage)}')">अपडेट करा</button> <button class="secondary" onclick="closeModal()">रद्द</button>`)}
function updateStageLabour(plotId,stage){let r=state.stageLabour[plotId+"|"+stage],w=Number(document.getElementById("editStageWorkers").value),d=Number(document.getElementById("editStageDays").value);if(w<=0||d<=0){alert("मजूर व दिवस शून्यापेक्षा जास्त असावेत");return}Object.assign(r,{workers:w,days:d,labourDays:w*d,note:document.getElementById("editStageNote").value});save();closeModal();render("crops")}
function deleteStageLabour(plotId,stage){if(confirm("ही मजूर गरज नोंद काढायची?")){delete state.stageLabour[plotId+"|"+stage];save();render("crops")}}
function toggleWageFields(){let type=document.getElementById("workerType").value;document.getElementById("dailyWageField").classList.toggle("hide",type!=="daily");document.getElementById("mukWageField").classList.toggle("hide",type!=="mukadam");document.getElementById("monthlyWageField").classList.toggle("hide",type!=="monthly");document.getElementById("contractWageField").classList.toggle("hide",type!=="contract")}
function monthKey(d){return String(d||TODAY).slice(0,7)}
let ATT_DATE=TODAY;
function setAttDate(v){if(!v)return;if(v>TODAY){alert("भविष्यातील तारखेची हजेरी नोंदवता येत नाही");return}ATT_DATE=v;render("workers")}
function workerPayroll(w,month=monthKey(TODAY)){
 const rows=state.attendance.filter(a=>a.workerId===w.id&&monthKey(a.date)===month);
 if(workerType(w)==="daily"||workerType(w)==="mukadam") return rows.reduce((sum,a)=>sum+Number(a.wage||0),0);
 if(workerType(w)==="contract") return rows.reduce((sum,a)=>sum+Number(a.contractPay||0),0);
 const present=rows.reduce((sum,a)=>sum+(a.status==="Present"?1:a.status==="Half"?0.5:0),0);
 const salary=Number(w.monthlySalary||w.wage||0),divisor=Math.max(1,Number(w.monthDivisor||30));
 return Math.min(salary,present*salary/divisor);
}
function workerPaid(w,month=monthKey(TODAY)){return (state.wagePayments||[]).filter(p=>p.workerId===w.id&&monthKey(p.date)===month&&(p.type==="salary"||p.type==="advance"||!p.type)).reduce((a,p)=>a+Number(p.amount||0),0)}
function addWorker(){let n=document.getElementById("workerName").value.trim(),type=document.getElementById("workerType").value,plot=document.getElementById("workerPlot").value.trim();if(!n){alert("नाव लिहा");return}let gender=document.getElementById("workerGender").value;let w={id:Date.now(),name:n,gender,wageType:type,plot};if(type==="monthly"){w.monthlySalary=Number(document.getElementById("workerMonthlySalary").value||0);w.monthDivisor=Number(document.getElementById("workerDivisor").value||30);if(w.monthlySalary<=0){alert("मासिक पगार टाका");return}}else if(type==="mukadam"){w.dailyRate=Number(document.getElementById("workerMukRate").value||0);w.femaleRate=Number(document.getElementById("workerMukRateF").value||0);if(w.dailyRate<=0||w.femaleRate<=0){alert("पुरुष व महिला दोन्ही दर टाका");return}}else if(type==="contract"){w.contractRate=Number(document.getElementById("workerContractRate").value||0);w.contractUnit=document.getElementById("workerContractUnit").value.trim();if(w.contractRate<=0||!w.contractUnit){alert("कंत्राटाची रक्कम आणि कामाचे वर्णन भरा");return}}else{w.dailyRate=Number(document.getElementById("workerDailyRate").value||0);if(w.dailyRate<=0){alert("दैनिक मजुरी टाका");return}}state.workers.push(w);save();closeModal();render("workers")}
function workerList(){if(!state.workers.length)return `<div class="empty">अजून मजूर जोडलेले नाहीत.</div>`;return state.workers.map(w=>{let monthly=workerType(w)==="monthly",contract=workerType(w)==="contract",due=workerPayroll(w),paid=workerPaid(w),balance=Math.max(0,due-paid);return `<div class="task"><div class="tasktop"><b>${esc(w.name)}</b><span class="tag">${w.gender==="female"?"महिला":"पुरुष"} • ${monthly?"मासिक पगार":contract?"कंत्राटी मजुरी":"रोजंदारी"}</span></div><div class="muted">${monthly?`मासिक ₹${fmt(w.monthlySalary||w.wage)} • हजर दिवसांनुसार (÷${w.monthDivisor||30})`:contract?`कंत्राट ₹${fmt(w.contractRate)} • ${esc(w.contractUnit||"")}`:`दैनिक ₹${fmt(w.dailyRate||w.wage)}`} ${w.plot?`• प्लॉट ${esc(w.plot)}`:""}</div><div style="margin:7px 0">या महिन्याचे देय: <b>₹${fmt(due)}</b> • दिले: ₹${fmt(paid)} • बाकी: <b>₹${fmt(balance)}</b></div><div class="muted" style="margin-bottom:5px">${dateFmt(ATT_DATE)} ची हजेरी: <b>${(()=>{let r=state.attendance.find(a=>a.workerId===w.id&&a.date===ATT_DATE);return r?(r.status==="Present"?"हजर":r.status==="Half"?"अर्धा दिवस":"गैरहजर"):"नोंदलेली नाही"})()}</b></div><div class="row"><button class="primary smallbtn" onclick="markAttendance(${w.id},'Present')">हजर</button><button class="secondary smallbtn" onclick="markAttendance(${w.id},'Half')">अर्धा दिवस</button><button class="secondary smallbtn" onclick="markAttendance(${w.id},'Absent')">गैरहजर</button></div>${(()=>{let r=state.attendance.find(a=>a.workerId===w.id&&a.date===ATT_DATE);if(!r||r.status==='Absent')return '';let al=attAlloc(w,ATT_DATE);return `<div class="row" style="margin-top:7px;align-items:center"><div class="muted" style="font-size:12px">📍 ${al.map(x=>esc(x.plot==="farm"?"सामायिक":(plotOrFarm(x.plot)?.name||""))+(al.length>1?" "+x.pct+"%":"")).join(" • ")}</div><button class="secondary smallbtn" style="flex:0 0 auto" onclick="allocForm(${w.id})">प्लॉट विभागणी</button></div>`})()}<div class="row" style="margin-top:7px"><button class="secondary smallbtn" onclick="recordWagePayment(${w.id})">पगार / अॅडव्हान्स द्या</button><button class="danger smallbtn" onclick="removeWorker(${w.id})">काढा</button></div></div>`}).join("")}
function attCore(w,status,reason,contractPay,heads){let id=w.id;let prior=state.attendance.find(a=>a.workerId===id&&a.date===ATT_DATE);if(prior&&(prior.wage||prior.contractPay)){let oldAmount=Number(prior.wage||prior.contractPay);let oldNote=workerType(w)==="contract"?w.name+" - कंत्राट":w.name;let ix=state.expenses.findIndex(e=>e.type==="मजुरी"&&e.note===oldNote&&e.date===ATT_DATE&&Number(e.amount)===oldAmount);if(ix>=0)state.expenses.splice(ix,1)}let keepAlloc=prior&&prior.alloc;state.attendance=state.attendance.filter(a=>!(a.workerId===id&&a.date===ATT_DATE));let wage=workerType(w)==="mukadam"?(Number(heads&&heads.m||0)*Number(w.dailyRate||0)+Number(heads&&heads.f||0)*Number(w.femaleRate||w.dailyRate||0)):workerType(w)==="daily"?(status==="Present"?Number(w.dailyRate||w.wage||0):status==="Half"?Number(w.dailyRate||w.wage||0)/2:0):0;state.attendance.push({workerId:id,name:w.name,status,date:ATT_DATE,wage,contractPay,...(workerType(w)==="mukadam"?{heads:Number(heads&&heads.m||0)+Number(heads&&heads.f||0),headsM:Number(heads&&heads.m||0),headsF:Number(heads&&heads.f||0),at:(prior&&prior.at)||Date.now()}:{}),absenceReason:reason,plot:w.plot||"",...(keepAlloc?{alloc:keepAlloc}:{})});if(wage)state.expenses.push({type:"मजुरी",amount:wage,note:w.name,date:ATT_DATE});if(contractPay)state.expenses.push({type:"मजुरी",amount:contractPay,note:w.name+" - कंत्राट",date:ATT_DATE})}
function markAttendance(id,status,ok){let w=state.workers.find(x=>x.id===id);if(!w)return;let prior=state.attendance.find(a=>a.workerId===id&&a.date===ATT_DATE);if(prior&&prior.status===status)return;if(prior&&!ok){pinNeed(()=>markAttendance(id,status,true));return}let reason="",contractPay=0;if(status==="Absent"){reason=prompt("गैरहजेरीचे कारण (ऐच्छिक)\nउदा. आजारपण, वैयक्तिक काम, पूर्वसूचना, संपर्क झाला नाही",prior?.absenceReason||"");if(reason===null)return}if(workerType(w)==="contract"&&status!=="Absent"){let suggested=status==="Half"?Number(w.contractRate||0)/2:Number(w.contractRate||0);contractPay=Number(prompt("या कामासाठी कंत्राटी देय रक्कम (₹) भरा",String(suggested))||0);if(contractPay<0||!Number.isFinite(contractPay)){alert("योग्य रक्कम भरा");return}}attCore(w,status,reason,contractPay);save();render("workers")}
function setHeads(id,n,ok){let w=state.workers.find(x=>x.id===id);if(!w)return;n=Math.max(0,Math.floor(Number(n)||0));if(n>500){alert("संख्या तपासा");return}let prior=state.attendance.find(a=>a.workerId===id&&a.date===ATT_DATE);if(prior&&Number(prior.heads||0)===n)return;if(prior&&!ok){pinNeed(()=>setHeads(id,n,true));return}attCore(w,n>0?"Present":"Absent","",0,n);save();render("workers")}
function headsNow(id,g){let r=state.attendance.find(a=>a.workerId===id&&a.date===ATT_DATE);if(!r)return 0;return g==="m"?Number(r.headsM!=null?r.headsM:r.heads||0):Number(r.headsF||0)}
function setHeads(id,g,n,ok){let w=state.workers.find(x=>x.id===id);if(!w)return;n=Math.max(0,Math.floor(Number(n)||0));if(n>500){alert("संख्या तपासा");return}let prior=state.attendance.find(a=>a.workerId===id&&a.date===ATT_DATE),m=headsNow(id,"m"),f=headsNow(id,"f");if(g==="m"){if(prior&&m===n)return;m=n}else{if(prior&&f===n)return;f=n}if(prior&&!ok&&!(prior.at&&Date.now()-prior.at<900000)){pinNeed(()=>setHeads(id,g,n,true));return}attCore(w,m+f>0?"Present":"Absent","",0,{m,f});save();render("workers")}
function bulkPresent(){let todo=state.workers.filter(w=>!state.attendance.some(a=>a.workerId===w.id&&a.date===ATT_DATE)&&workerType(w)!=="contract"&&workerType(w)!=="mukadam");if(!todo.length){alert("उरलेले (रोजंदारी/मासिक) मजूर नाहीत");return}if(!confirm(dateFmt(ATT_DATE)+" ला "+todo.length+" मजुरांना 'हजर' नोंदवायचे?\n(कंत्राटी मजूर वगळले जातात)"))return;todo.forEach(w=>attCore(w,"Present","",0));save();render("workers")}
const PAY_LABEL={salary:"पगार पेमेंट",advance:"अॅडव्हान्स / उचल",bonus:"बोनस / सण",other:"इतर"};
function payTypeChange(id){let w=state.workers.find(x=>x.id===id),t=document.getElementById("wagePayType").value;document.getElementById("wagePayAmount").value=t==="salary"?Math.max(0,workerPayroll(w,monthKey(document.getElementById("wagePayDate").value))-workerPaid(w,monthKey(document.getElementById("wagePayDate").value))):""}
let PAY_EDIT=null;
function workerPayHistory(id,month){let rows=(state.wagePayments||[]).filter(p=>p.workerId===id&&(!month||monthKey(p.date)===month)).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||a.id-b.id);return rows.length?rows.map(p=>`<div class="muted">• ${dateFmt(p.date)} — ₹${fmt(p.amount)} — ${PAY_LABEL[p.type]||"पगार पेमेंट"}${p.note?" ("+esc(p.note)+")":""}${p.from?" — 📅 "+dateFmt(p.from)+" → "+dateFmt(p.to):""}</div>`).join(""):`<div class="muted">या महिन्यात अजून पेमेंट नाही</div>`}
function editWagePayment(pid){let p=(state.wagePayments||[]).find(x=>x.id===pid);if(!p)return;recordWagePayment(p.workerId);PAY_EDIT=pid;document.getElementById("wagePayType").value=p.type||"salary";document.getElementById("wagePayAmount").value=p.amount;document.getElementById("wagePayDate").value=p.date;document.getElementById("wagePayNote").value=p.note||"";if(p.from){document.getElementById("pp_from").value=p.from;document.getElementById("pp_to").value=p.to}payPerSum(p.workerId);payShowPer();let h=document.getElementById("payEditHint");if(h)h.textContent="✏️ जुनी नोंद बदलत आहात — सेव्ह केल्यावर जुनी नोंद बदलली जाईल"}
function recordWagePayment(id){PAY_EDIT=null;let w=state.workers.find(x=>x.id===id);if(!w)return;let due=workerPayroll(w),paid=workerPaid(w),balance=Math.max(0,due-paid);openModal(`<h3>${esc(w.name)} — पेमेंट नोंद</h3><p class="muted">या महिन्याचे देय (आजपर्यंत) ₹${fmt(due)} • दिले ₹${fmt(paid)} • शिल्लक ₹${fmt(balance)}</p><div class="card" style="padding:9px 11px"><b style="font-size:13px">या महिन्यातील आधीची पेमेंट</b>${workerPayHistory(id,monthKey(TODAY))}</div><div id="payEditHint" class="muted" style="color:var(--amber)"></div><label>पेमेंटचे कारण</label><select id="wagePayType" onchange="payTypeChange(${id});payShowPer()">${Object.keys(PAY_LABEL).map(k=>`<option value="${k}">${PAY_LABEL[k]}</option>`).join("")}</select><div id="pp_box" class="card" style="margin:8px 0;padding:9px 11px;background:#f0f6f2"><b style="font-size:13px">📅 कोणत्या कालावधीचा पगार फेडत आहात?</b>${(()=>{let d=periodDefaults(w),cl=wkClearedTo(w);return (cl?`<div class="muted" style="font-size:12px">मागील पेमेंट: ${dateFmt(cl)} पर्यंत फेडले</div>`:"")+`<div style="margin:6px 0 2px">${[["last","मागील नंतर → आज"],["month","या महिन्याचा"],["week","गेले ७ दिवस"]].map(([k,l])=>`<span onclick="payPreset(${id},'${k}')" style="display:inline-block;padding:6px 11px;border-radius:16px;font-size:12px;font-weight:700;margin:0 5px 5px 0;border:1.5px solid #176b43;color:#176b43;background:white">${l}</span>`).join("")}</div><div class="row" style="gap:8px"><div style="flex:1"><label>पासून</label><input id="pp_from" type="date" value="${d.from}" max="${TODAY}" onchange="payPer(${id})"></div><div style="flex:1"><label>पर्यंत</label><input id="pp_to" type="date" value="${d.to}" max="${TODAY}" onchange="payPer(${id})"></div></div>`})()}<div id="pp_sum" style="font-size:13px;margin-top:6px"></div></div><label>रक्कम (₹)</label><input id="wagePayAmount" type="number" min="0" step="0.01" value="${balance}"><label>पेमेंट दिनांक (मागची तारीखही चालेल)</label><input id="wagePayDate" type="date" value="${TODAY}" max="${TODAY}"><label>कारण / नोंद (उदा. दवाखाना, सणाची उचल, मे महिन्याचा हिशोब)</label><input id="wagePayNote" placeholder="लिहा — 'इतर' निवडल्यास आवश्यक"><div class="row"><button class="secondary" onclick="closeModal()">रद्द</button><button class="primary" onclick="saveWagePayment(${id})">पेमेंट सेव्ह</button></div>`);payPer(id);payShowPer()}
function saveWagePayment(id){let amount=Number(document.getElementById("wagePayAmount").value||0);if(amount<=0){alert("योग्य रक्कम टाका");return}let w=state.workers.find(x=>x.id===id),date=document.getElementById("wagePayDate").value||TODAY,type=document.getElementById("wagePayType").value,note=document.getElementById("wagePayNote").value.trim();if(date>TODAY){alert("भविष्यातील तारीख चालणार नाही");return}if(type==="salary"){let a=document.getElementById("pp_from").value,b=document.getElementById("pp_to").value;if(!a||!b||a>b){alert("पगार कोणत्या कालावधीचा आहे ते (पासून / पर्यंत) बरोबर भरा");return}}if(type==="other"&&!note){alert("'इतर' निवडल्यास कारण / नोंद लिहा");return}state.wagePayments=state.wagePayments||[];if(PAY_EDIT){let o=state.wagePayments.find(x=>x.id===PAY_EDIT);if(o&&o.expNote){let ix=state.expenses.findIndex(e=>e.type==="मजुरी"&&e.note===o.expNote&&e.date===o.date&&Number(e.amount)===Number(o.amount));if(ix>=0)state.expenses.splice(ix,1)}state.wagePayments=state.wagePayments.filter(x=>x.id!==PAY_EDIT);PAY_EDIT=null}let expNote="";if(workerType(w)==="monthly"||type!=="salary"){expNote=`${w.name} - ${PAY_LABEL[type]}${note?" ("+note+")":""}`;state.expenses.push({type:"मजुरी",amount,note:expNote,date})}let pf=document.getElementById("pp_from").value,pt=document.getElementById("pp_to").value,per=type==="salary"&&pf&&pt?{from:pf,to:pt}:{};state.wagePayments.push({id:Date.now(),workerId:id,name:w.name,amount,date,type,note,expNote,...per});save();closeModal();render("workers")}
function deleteWagePayment(pid){let p=(state.wagePayments||[]).find(x=>x.id===pid);if(!p||!confirm("ही पेमेंट नोंद काढायची?"))return;if(p.expNote){let ix=state.expenses.findIndex(e=>e.type==="मजुरी"&&e.note===p.expNote&&e.date===p.date&&Number(e.amount)===Number(p.amount));if(ix>=0)state.expenses.splice(ix,1)}state.wagePayments=state.wagePayments.filter(x=>x.id!==pid);save();render("workers")}
let WK_TAB="att",PAY_MONTH=monthKey(TODAY);
function setWkTab(t){WK_TAB=t;render("workers")}
function shiftAttDate(n){let d=new Date(ATT_DATE+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);let s=d.toISOString().slice(0,10);if(s>TODAY)return;ATT_DATE=s;render("workers")}
function shiftPayMonth(n){let [y,m]=PAY_MONTH.split("-").map(Number);let d=new Date(Date.UTC(y,m-1+n,1));let k=d.toISOString().slice(0,7);if(k>monthKey(TODAY))return;PAY_MONTH=k;render("workers")}

function crc32(u){let c,t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=t[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}

 let cdStart=off,cdParts=[];cd.forEach(e=>{let h=[0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(e.crc),...u32(e.len),...u32(e.len),...u16(e.nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(e.off)];cdParts.push(new Uint8Array(h),e.nm);off+=h.length+e.nm.length});

 const SDK="https://www.gstatic.com/firebasejs/10.14.1/";
 const KEYS=["tasks","stock","workers","attendance","expenses","purchases","wagePayments","crops","plots","stageLabour","cropHarvest","cropExpenses","cropIncome","plotCrops","cropCats","contracts","attLock","schedEdits"];
 let cid=localStorage.getItem(CID_KEY);if(!cid){cid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(CID_KEY,cid)}
 let fb=null,user=null,docRef=null,unsub=null,timer=null,ready=false,lastSynced={},status="offline",msg="";
 const $=id=>document.getElementById(id);
 const cnt=s=>["purchases","expenses","attendance","cropExpenses","wagePayments"].reduce((a,k)=>a+((s&&Array.isArray(s[k]))?s[k].length:0),0);
 function stashPrev(why){try{const old=JSON.parse(localStorage.getItem("vm_prev_state")||"null");if(old&&cnt(old.state)>cnt(state))return;localStorage.setItem("vm_prev_state",JSON.stringify({at:new Date().toISOString(),why,state}))}catch(e){}}
 function remoteCnt(d){let n=0;["purchases","expenses","attendance","cropExpenses","wagePayments"].forEach(k=>{try{n+=JSON.parse(d["k_"+k]||"[]").length}catch(e){}});return n}
 function setStatus(s,m){status=s;msg=m||"";const b=$("syncBtn");if(b)b.textContent=({off:"☁ Sync",on:"☁ ✓ Synced",busy:"☁ …",err:"☁ ⚠"})[s]||"☁ Sync";}
 function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY))}catch(e){return null}}
 function parseCfg(txt){
  txt=String(txt||"").trim();
  const o={};["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"].forEach(k=>{const m=txt.match(new RegExp(k+"\\s*[\"']?\\s*:\\s*[\"']([^\"']+)[\"']"));if(m)o[k]=m[1]});
  if(!o.apiKey||!o.projectId||!o.appId)return null;return o;
 }
 async function loadSdk(){
  if(fb)return fb;
  const [app,auth,fs]=await Promise.all([import(SDK+"firebase-app.js"),import(SDK+"firebase-auth.js"),import(SDK+"firebase-firestore.js")]);
  fb={app,auth,fs};return fb;
 }
 async function start(){
  const cfg=getCfg();if(!cfg){setStatus("off");return}
  try{
   setStatus("busy");await loadSdk();
   const {app,auth,fs}=fb;
   if(!fb.a){fb.a=app.initializeApp(cfg);fb.auth_=auth.getAuth(fb.a);
    try{fb.db=fs.initializeFirestore(fb.a,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){fb.db=fs.getFirestore(fb.a)}
    auth.onAuthStateChanged(fb.auth_,u=>{user=u;if(u)attach(u);else{detach();setStatus("off")}});
   }
  }catch(e){setStatus("err","इंटरनेट/Firebase लोड झाले नाही");}
 }
 function detach(){if(unsub){unsub();unsub=null}ready=false;docRef=null}
 function attach(u){
  detach();const {fs}=fb;docRef=fs.doc(fb.db,"farms","shared");setStatus("busy");
  unsub=fs.onSnapshot(docRef,snap=>{
   if(!snap.exists()){ if(!snap.metadata.fromCache){ready=true;lastSynced={};pushNow(true)} return }
   const d=snap.data();let changed=false;
   if(!ready){ // first load after sign-in
    const remoteHas=KEYS.some(k=>d["k_"+k]!==undefined);
    const localHasData=state.workers.length||state.attendance.length||state.expenses.length||state.purchases.length||state.cropExpenses.length||Object.keys(state.tasks).length;
    if(remoteHas&&localHasData&&!snap.metadata.hasPendingWrites&&JSON.stringify(KEYS.filter(k=>d["k_"+k]!==undefined).map(k=>d["k_"+k]))!==JSON.stringify(KEYS.filter(k=>d["k_"+k]!==undefined).map(k=>JSON.stringify(state[k])))){
     {const lc=cnt(state),rc=remoteCnt(d);
     if(!confirm("क्लाउडवर आधीच डेटा आहे. या फोनचा डेटा क्लाउडच्या डेटाने बदलायचा का?\n\nया फोनवर: "+lc+" नोंदी (खरेदी "+state.purchases.length+", खर्च "+state.expenses.length+")\nक्लाउडवर: "+rc+" नोंदी\n\nज्यात जास्त नोंदी तोच नवीन डेटा असतो.\n\nOK = क्लाउडचा डेटा घ्या\nCancel = या फोनचा डेटा क्लाउडवर टाका")){
      if(rc>lc&&!confirm("⚠ क्लाउडवर जास्त नोंदी आहेत ("+rc+" > "+lc+"). फोनचा कमी डेटा टाकल्यास क्लाउडचा नवीन डेटा पुसला जाईल.\n\nतरीही फोनचा डेटा टाकायचा?\n\nOK = हो, फोनचा टाका\nCancel = नाही, क्लाउडचा घ्या")){stashPrev("first-load");}
      else{ready=true;lastSynced={};pushNow(true);return}}
     else stashPrev("first-load")}
    }
    ready=true;
   }
   if(snap.metadata.hasPendingWrites)return; // our own local write echo
   KEYS.forEach(k=>{const r=d["k_"+k];if(r===undefined)return;lastSynced[k]=r;
    if(r!==JSON.stringify(state[k])&&!(dirty[k])){try{if(!changed)stashPrev("remote");state[k]=JSON.parse(r);changed=true}catch(e){}}});
   if(changed){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
    const busy=document.querySelector("#modal:not(.hide)")||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"");
    try{applySchedEdits()}catch(e){}try{if(mergeStockDup(state))save()}catch(e){}try{repairTaskUnits();if(reconcileTaskCosts())save()}catch(e){}
    if(!busy)render(currentTab());}
   setStatus("on");
  },err=>{setStatus("err",String(err.code||err.message))});
 }
 const dirty={};
 function pushSoon(){
  KEYS.forEach(k=>{if(JSON.stringify(state[k])!==lastSynced[k])dirty[k]=true});
  clearTimeout(timer);timer=setTimeout(()=>pushNow(false),700);
 }
 async function pushNow(all){
  if(!docRef||!ready)return;
  const {fs}=fb,payload={_by:cid,_at:Date.now()},sent=[];
  KEYS.forEach(k=>{const j=JSON.stringify(state[k]);if(all||j!==lastSynced[k]){payload["k_"+k]=j;sent.push([k,j])}});
  if(!sent.length)return;
  try{await fs.setDoc(docRef,payload,{merge:true});sent.forEach(([k,j])=>{lastSynced[k]=j;delete dirty[k]});setStatus("on")}
  catch(e){setStatus("err",String(e.code||e.message))}
 }
 window.cloudPush=function(){if(docRef)pushSoon()};
 window.addEventListener("online",()=>{if(getCfg())start();if(docRef)pushSoon()});

 // ---------- UI ----------
 window.openSync=function(){
  const cfg=getCfg();
  if(!cfg){
   openModal(`<div class="section">☁ क्लाउड Sync चालू करा</div><p class="muted">सर्व फोनवर एकच डेटा दिसण्यासाठी Firebase जोडा. Firebase Console मधील firebaseConfig येथे paste करा (FIREBASE_SETUP.md पहा).</p><label>firebaseConfig</label><textarea id="fbCfg" rows="8" style="width:100%;font-size:13px;padding:8px;border:1px solid #cbd8ce;border-radius:9px" placeholder='const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." };'></textarea><div class="row"><button class="primary" onclick="saveFbCfg()">सेव्ह करा</button><button class="secondary" onclick="closeModal()">बंद करा</button></div>`);return;
  }
  if(!user){
   openModal(`<div class="section">☁ लॉगिन</div><p class="muted">सर्व फोनवर एकच ईमेल व पासवर्ड वापरा. पहिल्यांदा "नवीन खाते" दाबा.</p><label>ईमेल</label><input id="fbEmail" type="email" autocomplete="email"><label>पासवर्ड (किमान ६ अक्षरे)</label><input id="fbPass" type="password" autocomplete="current-password"><div class="row"><button class="primary" onclick="fbSign(false)">लॉगिन</button><button class="secondary" onclick="fbSign(true)">नवीन खाते</button></div><div id="fbErr" class="muted" style="color:#b42318;margin-top:6px">${esc(msg)}</div><div class="row" style="margin-top:10px"><button class="secondary smallbtn" onclick="resetFbCfg()">Firebase config बदला</button><button class="secondary smallbtn" onclick="closeModal()">बंद करा</button></div>`);return;
  }
  openModal(`<div class="section">☁ Sync स्थिती</div><div class="panel"><b>${esc(user.email)}</b><br><span class="muted">${status==="on"?"✓ क्लाउडशी जोडलेले — बदल सर्व फोनवर दिसतील":status==="err"?"⚠ "+esc(msg):"जोडणी सुरू आहे…"}</span></div><p class="muted">ऑफलाइन असताना केलेले बदल इंटरनेट आल्यावर आपोआप अपलोड होतात.</p><div class="row"><button class="secondary" onclick="fbForce()">आता पुन्हा अपलोड करा</button><button class="danger" onclick="fbOut()">लॉगआउट</button></div><div class="row" style="margin-top:8px"><button class="secondary smallbtn" onclick="restorePrev()">↩ मागील डेटा परत आणा</button><button class="secondary smallbtn" onclick="closeModal()">बंद करा</button></div>`);
 };
 window.restorePrev=function(){let p=null;try{p=JSON.parse(localStorage.getItem("vm_prev_state")||"null")}catch(e){}
  if(!p||!p.state){alert("मागील डेटा सापडला नाही.");return}
  if(!confirm("या फोनवर क्लाउडने बदलण्याआधीचा डेटा ("+new Date(p.at).toLocaleString("en-IN")+") परत आणायचा का?\n\nनोंदी: "+cnt(p.state)+" (सध्या "+cnt(state)+")\n\nहा डेटा क्लाउडवरही जाईल."))return;
  state=p.state;try{mergeStockDup(state)}catch(e){}save();lastSynced={};dirty.__all=1;if(window.cloudPush)window.cloudPush();closeModal();render("home");alert("मागील डेटा परत आणला.")};
 window.saveFbCfg=function(){const c=parseCfg($("fbCfg").value);if(!c){alert("config वाचता आली नाही. apiKey, projectId, appId असलेला पूर्ण भाग paste करा.");return}
  localStorage.setItem(CFG_KEY,JSON.stringify(c));closeModal();start().then(()=>openSync());setTimeout(openSync,600)};
 window.resetFbCfg=function(){if(confirm("Firebase config काढायची का?")){localStorage.removeItem(CFG_KEY);location.reload()}};
 window.fbSign=async function(create){
  const e=$("fbEmail").value.trim(),p=$("fbPass").value;if(!e||p.length<6){$("fbErr").textContent="ईमेल व किमान ६ अक्षरांचा पासवर्ड टाका.";return}
  try{await loadSdk();const a=fb.auth;$("fbErr").textContent="…";
   if(create)await a.createUserWithEmailAndPassword(fb.auth_,e,p);else await a.signInWithEmailAndPassword(fb.auth_,e,p);
   closeModal();
  }catch(err){const m={"auth/email-already-in-use":"हे खाते आधीच आहे — 'लॉगिन' दाबा.","auth/invalid-credential":"ईमेल किंवा पासवर्ड चुकीचा.","auth/wrong-password":"पासवर्ड चुकीचा.","auth/user-not-found":"खाते नाही — 'नवीन खाते' दाबा.","auth/weak-password":"पासवर्ड कमकुवत आहे.","auth/network-request-failed":"इंटरनेट नाही.","auth/operation-not-allowed":"Firebase मध्ये Email/Password sign-in चालू करा."}[err.code]||err.code||String(err);$("fbErr").textContent=m}
 };
 window.fbOut=async function(){if(!confirm("लॉगआउट करायचे? या फोनवरचा डेटा तसाच राहील."))return;await fb.auth.signOut(fb.auth_);closeModal()};
 window.fbForce=function(){lastSynced={};pushNow(true);closeModal()};
 start();
})();
try{applySchedEdits()}catch(e){}try{if(mergeStockDup(state))save()}catch(e){}try{repairTaskUnits();if(reconcileTaskCosts())save()}catch(e){}
render();
if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
</script></body></html>
